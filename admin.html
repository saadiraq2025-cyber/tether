<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم - الأدمن</title>
<style>
    body{font-family:Arial; background:#222; color:#fff; padding:20px; direction:rtl}
    .container{max-width:900px; margin:0 auto}
    .user-card{background:#333; padding:15px; margin:10px 0; border-radius:10px; border-right:5px solid #0b6}
    .controls{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px}
    button{padding:8px 15px; border:none; border-radius:5px; cursor:pointer}
    .btn-sub{background:#0b6; color:#fff}
    .btn-block{background:#f39c12; color:#fff}
    .btn-del{background:#e74c3c; color:#fff}
    input{padding:8px; border-radius:5px; border:none}
    .add-user{background:#444; padding:20px; border-radius:10px; margin-bottom:30px}
</style>
</head>
<body>
<div class="container">
    <h1>مدير المستخدمين والاشتراكات</h1>

    <div class="add-user">
        <h3>إضافة مستخدم جديد</h3>
        <input type="text" id="newPhone" placeholder="رقم الهاتف">
        <input type="text" id="newPass" placeholder="كلمة المرور">
        <button class="btn-sub" onclick="addUser()">إضافة حساب</button>
    </div>

    <div id="usersList"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDocs, collection, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyA_3TFx5dUR3JbcXj5jFIZ_mpjWeco7FVo",
 authDomain: "tktkbaghdad.firebaseapp.com",
 projectId: "tktkbaghdad",
 storageBucket: "tktkbaghdad.firebasestorage.app",
 messagingSenderId: "939931176033",
 appId: "1:939931176033:web:3b41b27dade80cca326e20"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// إضافة مستخدم
window.addUser = async () => {
    const phone = document.getElementById('newPhone').value;
    const pass = document.getElementById('newPass').value;
    if(!phone || !pass) return alert("أدخل البيانات");

    await setDoc(doc(db, "users", phone), {
        password: pass,
        isBlocked: false,
        expiry: Date.now() + (24*60*60*1000) // يوم تجريبي تلقائي
    });
    alert("تمت الإضافة");
    loadUsers();
};

// تفعيل الاشتراك
window.extendSub = async (phone, days) => {
    const userRef = doc(db, "users", phone);
    const addedTime = days * 24 * 60 * 60 * 1000;
    await updateDoc(userRef, {
        expiry: Date.now() + addedTime
    });
    loadUsers();
};

// حظر / فك حظر
window.toggleBlock = async (phone, currentStatus) => {
    await updateDoc(doc(db, "users", phone), { isBlocked: !currentStatus });
    loadUsers();
};

// حذف مستخدم
window.deleteUser = async (phone) => {
    if(confirm("حذف نهائي؟")) {
        await deleteDoc(doc(db, "users", phone));
        loadUsers();
    }
};

// تحديث كلمة المرور
window.updatePass = async (phone) => {
    const newPass = prompt("أدخل كلمة المرور الجديدة:");
    if(newPass) {
        await updateDoc(doc(db, "users", phone), { password: newPass });
        alert("تم التحديث");
        loadUsers();
    }
};

async function loadUsers() {
    const snap = await getDocs(collection(db, "users"));
    const list = document.getElementById('usersList');
    list.innerHTML = "";
    snap.forEach(u => {
        const d = u.data();
        const expiryDate = new Date(d.expiry).toLocaleString();
        list.innerHTML += `
            <div class="user-card">
                <strong>الهاتف: ${u.id} | كلمة المرور: ${d.password}</strong><br>
                <span>انتهاء الاشتراك: ${expiryDate}</span> | 
                <span style="color:${d.isBlocked?'red':'#0b6'}">${d.isBlocked?'محظور':'نشط'}</span>
                
                <div class="controls">
                    <button class="btn-sub" onclick="extendSub('${u.id}', 1)">+ دقيقة (يوم)</button>
                    <button class="btn-sub" onclick="extendSub('${u.id}', 30)">+ شهر</button>
                    <button class="btn-sub" onclick="extendSub('${u.id}', 365)">+ سنة</button>
                    <button class="btn-block" onclick="updatePass('${u.id}')">🔑 كلمة السر</button>
                    <button class="btn-block" onclick="toggleBlock('${u.id}', ${d.isBlocked})">🚫 حظر/تفعيل</button>
                    <button class="btn-del" onclick="deleteUser('${u.id}')">🗑️ حذف</button>
                </div>
            </div>
        `;
    });
}

loadUsers();
</script>
</body>
</html>

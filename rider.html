<script>
// تهيئة Firebase
const app=firebase.initializeApp({
  apiKey:"AIzaSyBZy7GTKn62CqeXAgm2fLrXI67P4Lc4Q3M",
  authDomain:"taxi-15314.firebaseapp.com",

  projectId:"taxi-15314"
});
const db=firebase.database();

// إنشاء الخريطة
let map=L.map('map').setView([33.3152,44.3661],13);

L.tileLayer(
  "https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&key=AIzaSyD7TtwniAdUtB8-pnTny4ZwE6gqX36SGUk",
  { maxZoom: 20 }
).addTo(map);

map.whenReady(()=>map.invalidateSize());

// ---------------- متغيرات الرحلة والخريطة ----------------
let startCoords=null,endCoords=null;
let startMarker=null,endMarker=null;
let currentMapMarker=null; // المؤشر الذي يتبعه المستخدم حالياً (للانطلاق أو الوصول)
let currentTarget = 'start'; // 'start' أو 'end' أو 'none'
let rideId=null;

let startAreaName="الموقع الحالي"; // العنوان الكامل للبداية
let endAreaName="الوجهة"; // العنوان الكامل للنهاية
let currentMapAreaName = "جاري التحقق..."; // الاسم الكامل للنقطة التي يتم تحريكها حالياً

let driverMarker=null;
let driverRoute=null;
let rideRef=null; 
let driverRef=null; 
let currentDriverPhone=null;

let currentDistance = 0;
let currentFare = 0;

// العناصر
const sendBtn=document.getElementById("sendRide");
const endBtn=document.getElementById("cancelRideBtn");
const searchInput=document.getElementById('searchInput');
const searchResultsUl=document.getElementById('searchResults');
const searchContainer=document.getElementById('searchContainer');
const driverInfoDiv=document.getElementById('driverInfo');
const logoutBtn=document.getElementById('logoutBtn');

const startInfoDiv = document.getElementById('startLocationInfo');
const endInfoDiv = document.getElementById('endLocationInfo');
const confirmStartBtn = document.getElementById('confirmStartBtn');
const confirmEndBtn = document.getElementById('confirmEndBtn');
const changeStartBtn = document.getElementById('changeStartBtn');
const changeEndBtn = document.getElementById('changeEndBtn');
const costDisplay = document.getElementById('costDisplay');

const SEARCH_DELAY=500;
let searchInputTimer=null;

// ---------------- وظائف المراقبة والتنظيف والمسار ----------------

// الدالة: استخلاص الاسم الأقصر للمنطقة (للعرض فقط)
function getShortAreaName(fullArea) {
    if (!fullArea) return "منطقة غير معروفة";
    const parts = fullArea.split(',').map(p => p.trim()).filter(p => p.length > 0);
    
    // محاولة جلب الجزء الذي لا يحتوي على كلمات إدارية
    const relevantParts = parts.filter(p => 
        !p.includes("قضاء") && 
        !p.includes("ناحية") && 
        !p.includes("مركز") &&
        !p.includes("بغداد") 
    );

    if (relevantParts.length > 0) {
        // نأخذ الجزء الأكثر دقة (عادة الأقرب للبداية في سلسلة العناوين)
        return relevantParts[0]; 
    }
    
    // إذا لم تنجح الفلترة، نأخذ الجزء الأخير (الأكثر احتمالاً أن يكون اسم الحي)
    return parts[parts.length - 1] || parts[0]; 
}

function clearRideMarkers(){
    if(driverMarker) map.removeLayer(driverMarker);
    if(driverRoute) map.removeLayer(driverRoute);
    driverMarker = null;
    driverRoute = null;
}

// دالة رسم مسار حقيقي على الشوارع باستخدام OSRM
async function drawStreetRoute(lat1, lng1, lat2, lng2, color, dashArray = '') {
    const OSRM_URL = `https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},lat2}?geometries=geojson&overview=full`;
    
    if(driverRoute) map.removeLayer(driverRoute); 
    driverRoute = null;
    
    try {
        const response = await fetch(OSRM_URL);
        const data = await response.json();

        if (data.code !== 'Ok' || !data.routes || data.routes.length === 0) {
            driverRoute = L.polyline([[lat1, lng1], [lat2, lng2]], { color: color, dashArray: dashArray, weight: 5 }).addTo(map);
        } else {
            const geojsonCoords = data.routes[0].geometry.coordinates;
            const leafletCoords = geojsonCoords.map(coord => [coord[1], coord[0]]);
            driverRoute = L.polyline(leafletCoords, { color: color, dashArray: dashArray, weight: 5 }).addTo(map);
        }
        
        map.fitBounds(driverRoute.getBounds());

    } catch (error) {
        driverRoute = L.polyline([[lat1, lng1], [lat2, lng2]], { color: color, dashArray: dashArray, weight: 5 }).addTo(map);
        map.fitBounds(driverRoute.getBounds());
    }
}


function cleanupRide(){
    if(rideRef) rideRef.off();
    if(driverRef) driverRef.off();
    rideRef = null;
    driverRef = null;
    currentDriverPhone = null;
    localStorage.removeItem('activeRideId');
    clearRideMarkers();
    
    // إعادة تعيين واجهة اختيار المواقع
    resetLocationSelectionUI();
}

function resetLocationSelectionUI() {
    // إزالة جميع مؤشرات التحديد
    if(startMarker) map.removeLayer(startMarker); startMarker = null;
    if(endMarker) map.removeLayer(endMarker); endMarker = null;
    if(currentMapMarker) map.removeLayer(currentMapMarker); currentMapMarker = null;

    // إعادة تعيين المتغيرات
    startCoords=null; endCoords=null;
    startAreaName="الموقع الحالي"; endAreaName="الوجهة";
    currentDistance = 0; currentFare = 0;
    
    // إعادة تعيين الحالة إلى وضع البداية
    currentTarget = 'start';
    updateUIState();
    
    // إخفاء الأزرار المتعلقة بالرحلة
    endBtn.style.display='none';
    sendBtn.style.display='none';
    searchContainer.style.display='none';
    driverInfoDiv.style.display='none';
    driverInfoDiv.innerHTML = '';
    logoutBtn.style.display='inline-block';
}


async function startMonitoringDriver(driverPhone, startLat, startLng, endLat, endLng, rideStatus){
    driverRef = db.ref("drivers/"+driverPhone);
    
    driverRef.on('value', async snap => { 
        const d = snap.val();
        if(!d || !d.lat || !d.lng) return;

        const driverCoords = [d.lat, d.lng];
        
        // تحديث معلومات السائق
        driverInfoDiv.innerHTML = `السائق: ${driverPhone} | الحالة: ${d.status || 'متصل'}`;

        // تحديث مؤشر السائق
        if(driverMarker) map.removeLayer(driverMarker);
        driverMarker = L.marker(driverCoords, {
            icon: L.divIcon({
                className: 'custom-driver-icon',
                html: '🚕', 
                iconSize: [30, 30]
            })
        }).addTo(map).bindPopup("السائق").openPopup();
        
        // منطق رسم المسار:
        if (rideStatus === "مقبولة" && startLat && startLng) {
            // المسار من السائق إلى الراكب (نقطة البداية)
            await drawStreetRoute(d.lat, d.lng, startLat, startLng, '#4CAF50', '5, 5'); 
        } else if (rideStatus === "بدأت" && endLat && endLng) {
            // المسار من السائق (الراكب) إلى نقطة النهاية
            await drawStreetRoute(d.lat, d.lng, endLat, endLng, '#007bff'); 
        } else {
            if(driverRoute) map.removeLayer(driverRoute);
            driverRoute = null;
        }
        
        // التركيز على موقع السائق إذا كانت مقبولة/بدأت
        map.setView(driverCoords, map.getZoom() > 14 ? map.getZoom() : 14);

    });
}

function startMonitoringRide(id){
    rideRef = db.ref("rides/"+id);
    
    // إخفاء واجهة اختيار المواقع وإظهار واجهة الرحلة النشطة
    hideLocationSelectionUI();
    endBtn.style.display='inline-block';
    driverInfoDiv.style.display='block';

    // مراقبة حالة الرحلة
    rideRef.on('value', snap => {
        const r = snap.val();
        if(!r) {
            cleanupRide();
            updateUIState("⚠️ انتهت الرحلة أو ألغيت من النظام.");
            return;
        }
        
        // جلب الإحداثيات الجديدة من قاعدة البيانات
        const r_startLat = r.startLat;
        const r_startLng = r.startLng;
        const r_endLat = r.endLat;
        const r_endLng = r.endLng;

        const distance = r.distance || 0;
        const fare = r.fare ? r.fare.toLocaleString('ar-IQ') : '---';
        
        // تحديث عرض المسافة والأجرة في الواجهة النشطة
        costDisplay.style.display = 'block';
        costDisplay.innerHTML = `المسافة: **${distance} كم** — الأجرة: **${fare} د.ع**`;
        
        // إعداد رابط الاتصال بالسائق
        let driverPhoneHtml = '';
        if (r.driverPhone) {
            driverPhoneHtml = `<a href="tel:${r.driverPhone}" class="phone-link">📞 اتصل بالسائق: ${r.driverPhone}</a>`;
            driverInfoDiv.innerHTML = `حالة السائق: ${r.driverPhone} | ${r.status}` + driverPhoneHtml;
        }
        
        // معالجة الحالات
        if (r.status === "جديدة") {
            driverInfoDiv.innerHTML = `✅ تم الإرسال. في انتظار قبول السائق...<br>` + driverPhoneHtml;
            clearRideMarkers();
            logoutBtn.style.display='inline-block';
            
        } else if (r.status === "مقبولة" && r.driverPhone) {
            const shortStartArea = getShortAreaName(r.startArea);
            driverInfoDiv.innerHTML=`🚖 تم قبول الرحلة! السائق قادم إليك (${shortStartArea}).<br>` + driverPhoneHtml;
            
            // البدء بتتبع موقع السائق ورسم المسار إليه
            if (r.driverPhone !== currentDriverPhone) {
                if(driverRef) driverRef.off(); 
                currentDriverPhone = r.driverPhone;
                startMonitoringDriver(r.driverPhone, r_startLat, r_startLng, r_endLat, r_endLng, r.status);
            } else if(driverRef) {
                startMonitoringDriver(r.driverPhone, r_startLat, r_startLng, r_endLat, r_endLng, r.status);
            }
            logoutBtn.style.display='none';
            
        } else if (r.status === "بدأت") {
             const shortEndArea = getShortAreaName(r.endArea);
             driverInfoDiv.innerHTML=`🚦 الرحلة بدأت! في طريقك إلى ${shortEndArea}<br>` + driverPhoneHtml;

             // تحديث موقع السائق
             if (r.driverPhone !== currentDriverPhone) {
                if(driverRef) driverRef.off(); 
                currentDriverPhone = r.driverPhone;
                startMonitoringDriver(r.driverPhone, r_startLat, r_startLng, r_endLat, r_endLng, r.status);
            } else if(driverRef) {
                startMonitoringDriver(r.driverPhone, r_startLat, r_startLng, r_endLat, r_endLng, r.status);
            }
            logoutBtn.style.display='none';
             
        } else if (r.status === "منتهية" || r.status === "ملغاة" || r.status === "مرفوضة") {
            driverInfoDiv.innerHTML=`الرحلة ${r.status}.`;
            cleanupRide(); 
        }
    });
}

function hideLocationSelectionUI() {
    document.getElementById('locationsContainer').style.display = 'none';
    searchContainer.style.display = 'none';
    confirmStartBtn.style.display = 'none';
    confirmEndBtn.style.display = 'none';
    sendBtn.style.display = 'none';
    costDisplay.style.display = 'none'; 
}

// ---------------- الوظائف الأساسية وتحديث الواجهة ----------------

// reverse geocode
async function reverseGeocode(lat,lon){
  const url=`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ar`;
  try{
    const r=await fetch(url);const d=await r.json();
    if(d&&d.display_name) return d.display_name.split(',').slice(0,3).reverse().join(', ');
    return `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
  }catch{return `${lat.toFixed(4)}, ${lon.toFixed(4)}`;}
}

function calculateFare(lat1, lng1, lat2, lng2) {
  const R=6371; // نصف قطر الأرض بالكيلومتر
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+
           Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
           Math.sin(dLon/2)*Math.sin(dLon/2);
  const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  const distance=(R*c).toFixed(2); // المسافة بالكيلومتر
  const fare=Math.round(distance*1000); // 1000 د.ع لكل كم
  return {distance: parseFloat(distance), fare: fare};
}

function updateCostDisplay() {
    if (startCoords && endCoords) {
        const {distance, fare} = calculateFare(startCoords[0], startCoords[1], endCoords[0], endCoords[1]);
        currentDistance = distance;
        currentFare = fare;
        costDisplay.innerHTML = `التكلفة: **${fare.toLocaleString('ar-IQ')} IQD**`;
        costDisplay.style.display = 'block';
    } else {
        costDisplay.style.display = 'none';
    }
}

function updateUIState() {
    // إخفاء جميع الأزرار الخاصة بالاختيار في البداية
    confirmStartBtn.style.display = 'none';
    confirmEndBtn.style.display = 'none';
    sendBtn.style.display = 'none';
    searchContainer.style.display = 'none';
    costDisplay.style.display = 'none';
    
    // إظهار واجهة المواقع وإخفاء واجهة الرحلة النشطة
    document.getElementById('locationsContainer').style.display = 'flex';
    endBtn.style.display='none';
    driverInfoDiv.style.display='none';
    logoutBtn.style.display='inline-block';

    // تحديث عرض نقطة الانطلاق
    const shortStart = startCoords ? getShortAreaName(startAreaName) : "جاري التحقق من المنطقة...";
    startInfoDiv.innerHTML = `<span>${shortStart}</span><span class="change-btn" id="changeStartBtn">تغيير</span>`;
    
    // تحديث عرض نقطة الوصول
    const shortEnd = endCoords ? getShortAreaName(endAreaName) : "لم يتم التحديد";
    endInfoDiv.innerHTML = `<span>${shortEnd}</span><span class="change-btn" id="changeEndBtn">تغيير</span>`;

    // إزالة مؤشر التحديد الحالي على الخريطة
    if(currentMapMarker) map.removeLayer(currentMapMarker);
    currentMapMarker = null;

    if (startMarker && endMarker) {
        // الحالة 3: تم تحديد الانطلاق والوصول
        currentTarget = 'none';
        map.fitBounds(L.latLngBounds(startCoords, endCoords).pad(0.2));
        updateCostDisplay();
        sendBtn.style.display = 'block';
        sendBtn.disabled = false;
        
    } else if (startCoords && !endCoords) {
        // الحالة 2: تم تحديد الانطلاق فقط
        currentTarget = 'end';
        confirmEndBtn.style.display = 'block';
        searchContainer.style.display = 'block';
        map.setView(startCoords, map.getZoom() > 14 ? map.getZoom() : 14);
        
        // إظهار مؤشر التحديد في مركز الخريطة لتعيين نقطة الوصول
        const center = map.getCenter();
        placeMapMarker(center.lat, center.lng, '🏁', 'نقطة الوصول');
        
    } else if (!startCoords) {
        // الحالة 1: لم يتم تحديد الانطلاق
        currentTarget = 'start';
        confirmStartBtn.style.display = 'block';
        searchContainer.style.display = 'block';
        // لا نغير العرض الحالي للخريطة (يفترض أن يكون على الموقع الحالي)
        
        // إظهار مؤشر التحديد في مركز الخريطة لتعيين نقطة الانطلاق
        const center = map.getCenter();
        placeMapMarker(center.lat, center.lng, '📍', 'نقطة الانطلاق');
    }
    
    // إعادة تعيين مستمعي الأحداث لأزرار التغيير
    document.getElementById('changeStartBtn').onclick = () => startChangeLocation('start');
    document.getElementById('changeEndBtn').onclick = () => startChangeLocation('end');
}

// دالة لوضع مؤشر مركزي على الخريطة
async function placeMapMarker(lat, lng, icon, name) {
    if(currentMapMarker) map.removeLayer(currentMapMarker);
    currentMapMarker = L.marker([lat, lng], {
        draggable: true,
        icon: L.divIcon({
            className: 'custom-map-icon',
            html: icon, 
            iconSize: [30, 30]
        })
    }).addTo(map).bindPopup(name).openPopup();
    
    currentMapAreaName = await reverseGeocode(lat, lng);
    updateTemporaryInfo(currentMapAreaName);

    currentMapMarker.on('dragend', async function(e) {
        const coords = e.target.getLatLng();
        currentMapAreaName = await reverseGeocode(coords.lat, coords.lng);
        updateTemporaryInfo(currentMapAreaName);
    });
    
    // تحديث الإحداثيات عند تحريك الخريطة
    map.off('moveend', mapMoveHandler); // إزالة المستمع القديم
    map.on('moveend', mapMoveHandler); // إضافة المستمع الجديد
}

async function mapMoveHandler() {
    const center = map.getCenter();
    currentMapMarker.setLatLng(center);
    currentMapAreaName = await reverseGeocode(center.lat, center.lng);
    updateTemporaryInfo(currentMapAreaName);
}

function updateTemporaryInfo(fullArea) {
    const shortName = getShortAreaName(fullArea);
    if (currentTarget === 'start') {
        startInfoDiv.innerHTML = `<span>${shortName}</span><span class="change-btn" style="background:#4CAF50;">تثبيت</span>`;
        confirmStartBtn.innerText = `تثبيت الانطلاق (${shortName})`;
        confirmStartBtn.style.display = 'block';
        confirmEndBtn.style.display = 'none';
    } else if (currentTarget === 'end') {
        endInfoDiv.innerHTML = `<span>${shortName}</span><span class="change-btn" style="background:#4CAF50;">تثبيت</span>`;
        confirmEndBtn.innerText = `تثبيت الوصول (${shortName})`;
        confirmEndBtn.style.display = 'block';
        confirmStartBtn.style.display = 'none';
    }
}

// وظيفة لبدء عملية تغيير الموقع (الانطلاق أو الوصول)
function startChangeLocation(target) {
    if (rideId) return; // لا يمكن تغيير الموقع أثناء الرحلة
    currentTarget = target;
    searchContainer.style.display = 'block';
    if(startMarker) map.removeLayer(startMarker);
    if(endMarker) map.removeLayer(endMarker);
    
    const initialCoords = target === 'start' && startCoords ? startCoords : 
                          target === 'end' && endCoords ? endCoords : 
                          map.getCenter();
    
    map.setView(initialCoords, map.getZoom() > 14 ? map.getZoom() : 14);
    
    const icon = target === 'start' ? '📍' : '🏁';
    const name = target === 'start' ? 'نقطة الانطلاق' : 'نقطة الوصول';
    
    placeMapMarker(initialCoords[0], initialCoords[1], icon, name);
    
    // إخفاء الأزرار الأخرى وعرض زر التأكيد المناسب
    if (target === 'start') {
        confirmStartBtn.style.display = 'block';
        confirmEndBtn.style.display = 'none';
        sendBtn.style.display = 'none';
    } else {
        confirmStartBtn.style.display = 'none';
        confirmEndBtn.style.display = 'block';
        sendBtn.style.display = 'none';
    }
}

// معالج تحديد الموقع بالنقر (للخريطة عند عدم وجود مؤشر مركزي)
map.on('click',async function(e){
    if (currentTarget !== 'none' && currentMapMarker) {
        // إذا كنا في وضع التحديد، فإننا نستخدم المؤشر المركزي فقط، ولا نستجيب للنقر مباشرة
        return; 
    }
    // ولكن في وضع عرض الرحلة (currentTarget='none') قد نحتاج لتغيير نقطة واحدة
    
    if (startCoords && endCoords) {
        // إذا تم تحديد النقطتين، النقر يبدأ وضع تغيير الوصول
        startChangeLocation('end');
    } else if (startCoords) {
        // إذا تم تحديد البداية فقط، النقر يبدأ وضع تغيير الوصول
        startChangeLocation('end');
    } else {
        // إذا لم يتم تحديد أي شيء، النقر يبدأ وضع تغيير البداية
        startChangeLocation('start');
    }
    
    // تحريك المؤشر المركزي للنقطة التي تم النقر عليها
    currentMapMarker.setLatLng(e.latlng);
    currentMapAreaName = await reverseGeocode(e.latlng.lat, e.latlng.lng);
    updateTemporaryInfo(currentMapAreaName);
});


// وظائف أزرار التثبيت
confirmStartBtn.onclick = function() {
    if(!currentMapMarker) return;
    
    startCoords = [currentMapMarker.getLatLng().lat, currentMapMarker.getLatLng().lng];
    startAreaName = currentMapAreaName;

    // إزالة مؤشر الانطلاق القديم ووضع المؤشر الثابت
    if(startMarker) map.removeLayer(startMarker);
    startMarker = L.marker(startCoords, {icon: L.icon({iconUrl: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232e7d32" width="24px" height="24px"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>', iconSize: [30, 30], iconAnchor: [15, 30]})}).addTo(map).bindPopup(`📍 ${getShortAreaName(startAreaName)}`).openPopup();
    
    updateUIState();
};

confirmEndBtn.onclick = function() {
    if(!currentMapMarker) return;
    
    endCoords = [currentMapMarker.getLatLng().lat, currentMapMarker.getLatLng().lng];
    endAreaName = currentMapAreaName;

    // إزالة مؤشر الوصول القديم ووضع المؤشر الثابت
    if(endMarker) map.removeLayer(endMarker);
    endMarker = L.marker(endCoords, {icon: L.icon({iconUrl: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23E53935" width="24px" height="24px"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>', iconSize: [30, 30], iconAnchor: [15, 30]})}).addTo(map).bindPopup(`🏁 ${getShortAreaName(endAreaName)}`).openPopup();
    
    updateUIState();
};

// وظيفة البحث
function searchLocation(q){
  if(q.length<3){searchResultsUl.innerHTML='';searchResultsUl.style.display='none';return;}
  // يجب أن يكون البحث دائماً على النقطة التي نحاول تحديدها حالياً
  const searchArea = (currentTarget === 'start' && startAreaName) ? startAreaName : 'بغداد, العراق';
  const url=`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q+", "+searchArea)}&format=json&limit=5&addressdetails=1&accept-language=ar`;
  fetch(url).then(r=>r.json()).then(data=>{
    searchResultsUl.innerHTML='';
    if(data.length>0){
      data.forEach(item=>{
        let li=document.createElement('li');
        let fullArea=item.display_name.split(',').slice(0,3).reverse().join(', ');
        let shortArea=getShortAreaName(fullArea);
        
        li.innerText=shortArea;
        li.onclick=()=>selectSearchResult(item.lat,item.lon,fullArea);
        searchResultsUl.appendChild(li);
      });
      searchResultsUl.style.display='block';
    }else{
      searchResultsUl.innerHTML='<li>لا توجد نتائج.</li>';
      searchResultsUl.style.display='block';
    }
  });
}

function selectSearchResult(lat,lng,name){
  searchResultsUl.innerHTML='';searchResultsUl.style.display='none';
  
  const latlng=L.latLng(parseFloat(lat),parseFloat(lng));
  map.setView(latlng,15);
  
  // نقل المؤشر المركزي إلى نتيجة البحث
  if(currentMapMarker) currentMapMarker.setLatLng(latlng);
  
  currentMapAreaName = name;
  updateTemporaryInfo(currentMapAreaName);
  
  // تحديث حقل البحث بالاسم المختصر
  searchInput.value = getShortAreaName(name);
}

searchInput.addEventListener('input',e=>{
  clearTimeout(searchInputTimer);
  searchInputTimer=setTimeout(()=>searchLocation(e.target.value.trim()),SEARCH_DELAY);
});

document.addEventListener('click',e=>{
  if(!searchContainer.contains(e.target)) searchResultsUl.style.display='none';
});

// إرسال الطلب
sendBtn.onclick=function(){
  if(!startCoords||!endCoords){alert("حدد المواقع.");return;}
  if(rideId) return; // لا ترسل إذا كان هناك طلب نشط

  const phone=localStorage.getItem('phone');

  // يتم حساب المسافة والأجرة في updateUIState
  const distance = currentDistance.toFixed(2); 
  const fare = currentFare;

  rideId=Date.now();
  localStorage.setItem('activeRideId',rideId);

  // إعداد بيانات الرحلة في Firebase
  db.ref("rides/"+rideId).set({
    riderPhone:phone,
    startLat:startCoords[0], startLng:startCoords[1],
    endLat:endCoords[0], endLng:endCoords[1],
    startArea:startAreaName,endArea:endAreaName, 
    distance:distance,fare:fare,status:"جديدة"
  });

  // تحديث واجهة المستخدم لبدء المراقبة
  startMonitoringRide(rideId);
};

// إلغاء الطلب
endBtn.onclick=function(){
    if(!rideId) return;

    db.ref("rides/"+rideId).update({status:"ملغاة", canceledBy:"rider"});
    // يتم التنظيف تلقائياً من خلال startMonitoringRide
};

// تحديد الموقع عند التحميل
navigator.geolocation.getCurrentPosition(async pos=>{
  // تحديد إحداثيات الموقع الحالي مبدئياً
  const initialLat = pos.coords.latitude;
  const initialLng = pos.coords.longitude;
  
  map.setView([initialLat, initialLng],15);
  
  // Reverse geocode لتحديد الاسم الكامل للمنطقة
  const fullArea = await reverseGeocode(initialLat, initialLng);
  
  // ضبط نقطة الانطلاق لتكون الموقع الحالي للمستخدم
  startCoords = [initialLat, initialLng];
  startAreaName = fullArea;
  
  // وضع مؤشر الانطلاق الثابت
  if(startMarker) map.removeLayer(startMarker);
  startMarker = L.marker(startCoords, {icon: L.icon({iconUrl: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232e7d32" width="24px" height="24px"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>', iconSize: [30, 30], iconAnchor: [15, 30]})}).addTo(map).bindPopup(`📍 ${getShortAreaName(startAreaName)}`).openPopup();

  // التحقق من وجود رحلة نشطة وبدء المراقبة بعد تحديد الموقع
  rideId = localStorage.getItem('activeRideId');
  if(rideId){
    map.whenReady(() => startMonitoringRide(rideId));
  } else {
    // تحديث الواجهة للدخول إلى وضع اختيار الوصول
    updateUIState(); 
  }
  
},err=>{
  // إذا لم يتم تحديد الموقع
  updateUIState();
  
  // التحقق من وجود رحلة نشطة حتى لو فشل تحديد الموقع
  rideId = localStorage.getItem('activeRideId');
  if(rideId){
    map.whenReady(() => startMonitoringRide(rideId));
  }
  
},{enableHighAccuracy:true,timeout:10000,maximumAge:0});


// منع خروج المستخدم
window.onload=function(){
    let phone=localStorage.getItem("phone");
    let userType=localStorage.getItem("userType");

    if(!phone||!userType){window.location.href="index.html";return;}
    if(userType==="driver") window.location.href="driver.html";
};

window.logout=function(){
    if(rideRef) rideRef.off();
    if(driverRef) driverRef.off();
    localStorage.removeItem('phone');
    localStorage.removeItem('userType');
    localStorage.removeItem('activeRideId');
    window.location.href="index.html";
};

</script>

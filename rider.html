<div id="panel">

<script>
// تهيئة Firebase
const app=firebase.initializeApp({
  apiKey:"AIzaSyBZy7GTKn62CqeXAgm2fLrXI67P4Lc4Q3M",
  authDomain:"taxi-15314.firebaseapp.com",
  databaseURL:"https://taxi-15314-default-rtdb.firebaseio.com/",
  projectId:"taxi-15314"
});
const db=firebase.database();

// إنشاء الخريطة
let map=L.map('map').setView([33.3152,44.3661],13);

L.tileLayer(
  "https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&key=AIzaSyD7TtwniAdUtB8-pnTny4ZwE6gqX36SGUk",
  { maxZoom: 20 }
).addTo(map);

map.whenReady(()=>map.invalidateSize());

// ---------------- متغيرات الرحلة والخريطة ----------------
let startCoords=null,endCoords=null;
let startMarker=null,endMarker=null;
let rideId=null;

let startAreaName="الموقع الحالي"; // لتخزين العنوان الكامل
let endAreaName="الوجهة"; // لتخزين العنوان الكامل

let driverMarker=null;
let driverRoute=null;
let rideRef=null; 
let driverRef=null; 
let currentDriverPhone=null;

// ⭐⭐ متغير جديد لتخزين مؤقت التتبع ⭐⭐
let driverTrackingInterval = null; 

const sendBtn=document.getElementById("sendRide");
const endBtn=document.getElementById("cancelRideBtn");
const searchInput=document.getElementById('searchInput');
const searchResultsUl=document.getElementById('searchResults');
const searchContainer=document.getElementById('searchContainer');
const driverInfoDiv=document.getElementById('driverInfo');
const logoutBtn=document.getElementById('logoutBtn'); // إضافة مرجع زر تسجيل الخروج

const SEARCH_DELAY=500;
let searchInputTimer=null;

// ---------------- وظائف المراقبة والتنظيف والمسار ----------------

// الدالة: استخلاص الاسم الأقصر للمنطقة (للعرض فقط)
function getShortAreaName(fullArea) {
    if (!fullArea) return "منطقة غير معروفة";
    const parts = fullArea.split(',').map(p => p.trim()).filter(p => p.length > 0);
    
    // محاولة جلب الجزء الذي لا يحتوي على كلمات إدارية
    const relevantParts = parts.filter(p => 
        !p.includes("قضاء") && 
        !p.includes("ناحية") && 
        !p.includes("مركز") &&
        !p.includes("بغداد") 
    );

    if (relevantParts.length > 0) {
        // نأخذ الجزء الأكثر دقة (عادة الأقرب للبداية في سلسلة العناوين)
        return relevantParts[0]; 
    }
    
    // إذا لم تنجح الفلترة، نأخذ الجزء الأخير (الأكثر احتمالاً أن يكون اسم الحي)
    return parts[parts.length - 1]; 
}

function clearRideMarkers(){
    // يتم إزالة مؤشر السائق والمسار المرسوم
    if(driverMarker) map.removeLayer(driverMarker);
    if(driverRoute) map.removeLayer(driverRoute);
    driverMarker = null;
    driverRoute = null;
}

// دالة رسم مسار حقيقي على الشوارع باستخدام OSRM
async function drawStreetRoute(lat1, lng1, lat2, lng2, color, dashArray = '') {
    // خدمة OSRM تتطلب الإحداثيات بصيغة: lng,lat
    const OSRM_URL = `https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?geometries=geojson&overview=full`;
    
    // إزالة المسار الحالي قبل الرسم
    // (ملاحظة: driverMarker و driverRoute يتم تحديثهما في startMonitoringDriver) 
    if(driverRoute) map.removeLayer(driverRoute);

    try {
        const response = await fetch(OSRM_URL);
        const data = await response.json();

        if (data.code !== 'Ok' || !data.routes || data.routes.length === 0) {
            console.error('OSRM route calculation failed or no route found. Falling back to straight line.');
            // العودة إلى الرسم البسيط في حال الفشل
            driverRoute = L.polyline([[lat1, lng1], [lat2, lng2]], { color: color, dashArray: dashArray, weight: 5 }).addTo(map);
        } else {
            // استخراج إحداثيات المسار من الاستجابة (بصيغة GeoJSON: [lng, lat])
            const geojsonCoords = data.routes[0].geometry.coordinates;

            // تحويل الإحداثيات إلى صيغة Leaflet ([lat, lng])
            const leafletCoords = geojsonCoords.map(coord => [coord[1], coord[0]]);

            driverRoute = L.polyline(leafletCoords, { color: color, dashArray: dashArray, weight: 5 }).addTo(map);
        }
        
        // لا داعي لتكبير/تصغير الخريطة في كل تحديث، نكتفي بالمسار الجديد
        // map.fitBounds(driverRoute.getBounds());

    } catch (error) {
        console.error('Error fetching route from OSRM. Falling back to straight line.', error);
        // العودة إلى الرسم البسيط في حال الفشل
        driverRoute = L.polyline([[lat1, lng1], [lat2, lng2]], { color: color, dashArray: dashArray, weight: 5 }).addTo(map);
        // map.fitBounds(driverRoute.getBounds());
    }
}


function cleanupRide(){
    if(rideRef) rideRef.off();
    if(driverRef) driverRef.off();
    // ⭐⭐ إيقاف مؤقت التتبع ⭐⭐
    if(driverTrackingInterval) clearInterval(driverTrackingInterval);
    driverTrackingInterval = null;
    
    rideRef = null;
    driverRef = null;
    currentDriverPhone = null;
    localStorage.removeItem('activeRideId');
    clearRideMarkers();
    
    endBtn.style.display='none';
    sendBtn.style.display='inline-block';
    searchContainer.style.display='block';
    driverInfoDiv.style.display='none';
    driverInfoDiv.innerHTML = '';
    logoutBtn.style.display='inline-block'; // إظهار زر تسجيل الخروج
}

// ⭐⭐ تعديل: استخدام التحديث كل 2 ثانية ⭐⭐
async function startMonitoringDriver(driverPhone, startLat, startLng, endLat, endLng, rideStatus) {
    // 1. إيقاف أي مؤقت سابق للتأكد من عدم وجود تحديثات مكررة
    if(driverTrackingInterval) clearInterval(driverTrackingInterval); 
    
    // 2. دالة التحديث التي سيتم استدعاؤها كل 2 ثانية
    const updateDriverLocation = async () => {
         // نستخدم once لجلب القيمة الحالية بدلاً من on للحصول على تحكم كامل بالتحديث (كل 2 ثانية)
        const snap = await db.ref("drivers/"+driverPhone).once('value');
        const d = snap.val();

        if(!d || !d.lat || !d.lng) return;

        const driverCoords = [d.lat, d.lng];
        
        // تحديث معلومات السائق
        driverInfoDiv.innerHTML = `السائق: ${driverPhone} | الحالة: ${d.status || 'متصل'}`;

        // تحديث مؤشر السائق
        if(driverMarker) map.removeLayer(driverMarker);
        driverMarker = L.marker(driverCoords, {
            icon: L.divIcon({
                className: 'custom-driver-icon',
                html: '🚕', 
                iconSize: [30, 30]
            })
        }).addTo(map).bindPopup("السائق").openPopup();
        
        // منطق رسم المسار
        if (rideStatus === "مقبولة" && startLat && startLng) {
            // المسار من السائق إلى الراكب (نقطة البداية)
            await drawStreetRoute(d.lat, d.lng, startLat, startLng, '#4CAF50', '5, 5'); 
        } else if (rideStatus === "بدأت" && startLat && startLng && endLat && endLng) {
            // المسار من الراكب إلى الوجهة
            await drawStreetRoute(startLat, startLng, endLat, endLng, '#1E90FF'); 
        }
    };

    // 3. استدعاء فوري لعرض الموقع الأولي
    await updateDriverLocation(); 
    
    // 4. إعداد المؤقت ليتم الاستقصاء كل 2 ثانية (2000 مللي ثانية)
    driverTrackingInterval = setInterval(updateDriverLocation, 2000); 
}

function startMonitoringRide(id){
    rideRef = db.ref("rides/"+id);
    endBtn.style.display='inline-block';
    sendBtn.style.display='none';
    searchContainer.style.display='none';

    // تنسيقات مضافة حديثاً لجعل الأجرة والمسافة بارزة
    const fareStyle = "font-size: 1em; font-weight: bold; color: #E53935;"; 
    const distanceStyle = "font-size: 1em; font-weight: bold; color: #455A64;"; 

    // مراقبة حالة الرحلة
    rideRef.on('value', snap => {
        const r = snap.val();
        if(!r) {
            cleanupRide();
            document.getElementById("status").innerHTML=`⚠️ انتهت الرحلة أو ألغيت من النظام.`;
            return;
        }
        
        // جلب الإحداثيات الجديدة من قاعدة البيانات
        const r_startLat = r.startLat;
        const r_startLng = r.startLng;
        const r_endLat = r.endLat;
        const r_endLng = r.endLng;

        const distance = r.distance || 0;
        const fare = r.fare ? r.fare.toLocaleString('ar-IQ') : '---';
        
        // إزالة النجوم وتطبيق التنسيق الداخلي
        let statusHtml = `المسافة: <span style="${distanceStyle}">${distance} كم</span> — الأجرة: <span style="${fareStyle}">${fare} د.ع</span><br>`;
        
        // إعداد رابط الاتصال بالسائق ليتم استخدامه في الحالتين (مقبولة وبدأت)
        let driverPhoneHtml = '';
        if (r.driverPhone) {
            driverPhoneHtml = `<a href="tel:${r.driverPhone}" class="phone-link">📞 اتصل بالسائق: ${r.driverPhone}</a>`;
        }
        
        // معالجة الحالات
        if (r.status === "جديدة") {
            document.getElementById("status").innerHTML=`✅ تم الإرسال. في انتظار قبول السائق...<br>` + statusHtml;
            driverInfoDiv.style.display='none';
            // ⭐⭐ إيقاف التتبع عند حالة "جديدة" ⭐⭐
            if(driverTrackingInterval) clearInterval(driverTrackingInterval); 
            clearRideMarkers();
            logoutBtn.style.display='inline-block'; // إظهار الزر
            
        } else if (r.status === "مقبولة" && r.driverPhone) {
            
            const shortStartArea = getShortAreaName(r.startArea);
            document.getElementById("status").innerHTML=`🚖 تم قبول الرحلة! السائق قادم إليك (${shortStartArea}).<br>` + statusHtml + driverPhoneHtml;
            driverInfoDiv.style.display='block';
            
            // البدء بتتبع موقع السائق
            if (r.driverPhone !== currentDriverPhone) {
                // إيقاف أي تتبع سابق قبل البدء بتتبع سائق جديد
                if(driverTrackingInterval) clearInterval(driverTrackingInterval); 
                currentDriverPhone = r.driverPhone;
                startMonitoringDriver(r.driverPhone, r_startLat, r_startLng, r_endLat, r_endLng, r.status);
            } 
            logoutBtn.style.display='none'; // إخفاء زر تسجيل الخروج
            
        } else if (r.status === "بدأت") {
             // إظهار رابط الاتصال مجدداً وتحديث الرسالة
             const shortEndArea = getShortAreaName(r.endArea);
             // إزالة النجوم
             document.getElementById("status").innerHTML=`🚦 الرحلة بدأت! في طريقك إلى ${shortEndArea}<br>` + statusHtml + driverPhoneHtml; // تمت إضافة رابط الاتصال
             driverInfoDiv.style.display='block';

             // تحديث مسار السائق إلى نقطة النهاية
             if (r.driverPhone !== currentDriverPhone) {
                // إيقاف أي تتبع سابق قبل البدء بتتبع سائق جديد
                if(driverTrackingInterval) clearInterval(driverTrackingInterval); 
                currentDriverPhone = r.driverPhone;
                startMonitoringDriver(r.driverPhone, r_startLat, r_startLng, r_endLat, r_endLng, r.status);
            }
            logoutBtn.style.display='none'; // إخفاء زر تسجيل الخروج
             
        } else if (r.status === "منتهية" || r.status === "ملغاة" || r.status === "مرفوضة") {
            // إزالة النجوم
            document.getElementById("status").innerHTML=`الرحلة ${r.status}.`;
            cleanupRide(); 
        }
    });
}

// ---------------- الوظائف الأساسية ----------------

// reverse geocode
async function reverseGeocode(lat,lon){
  const url=`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ar`;
  try{
    const r=await fetch(url);const d=await r.json();
    // نرجع العنوان المفصل (المقصوص) ونستخدم getShortAreaName للعرض فقط
    if(d&&d.display_name) return d.display_name.split(',').slice(0,3).reverse().join(', ');
    return `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
  }catch{return `${lat.toFixed(4)}, ${lon.toFixed(4)}`;}
}

// تحديد الموقع
navigator.geolocation.getCurrentPosition(async pos=>{
  startCoords=[pos.coords.latitude,pos.coords.longitude];
  if(startMarker) map.removeLayer(startMarker);
  startMarker=L.marker(startCoords).addTo(map).bindPopup("📍 موقعك").openPopup();
  map.setView(startCoords,15);

  startAreaName=await reverseGeocode(startCoords[0],startCoords[1]);
  const shortStartArea = getShortAreaName(startAreaName); // استخدام الاسم المختصر للعرض
  document.getElementById("status").innerHTML=`📍 موقعك: <b>${shortStartArea}</b><br>حدد نقطة النهاية.`;

  // التحقق من وجود رحلة نشطة وبدء المراقبة بعد تحديد الموقع
  rideId = localStorage.getItem('activeRideId');
  if(rideId){
    map.whenReady(() => {
        startMonitoringRide(rideId);
    });
  }
},err=>{
  document.getElementById("status").innerText="⚠️ لم يتم تحديد الموقع.";
},{enableHighAccuracy:true,timeout:10000,maximumAge:0});

// تحديد النهاية بالنقر
map.on('click',async function(e){
  searchInput.value='';
  searchResultsUl.innerHTML='';searchResultsUl.style.display='none';

  if(endMarker) map.removeLayer(endMarker);
  endCoords=[e.latlng.lat,e.latlng.lng];
  endMarker=L.marker(endCoords).addTo(map).bindPopup("🏁 نهاية").openPopup();

  endAreaName=await reverseGeocode(endCoords[0],endCoords[1]);
  const shortEndArea = getShortAreaName(endAreaName); // استخدام الاسم المختصر للعرض
  document.getElementById("status").innerHTML=`تم تحديد النهاية: <b>${shortEndArea}</b>`;
  sendBtn.disabled=false;
});

// وظيفة البحث
function searchLocation(q){
  if(q.length<3){searchResultsUl.innerHTML='';searchResultsUl.style.display='none';return;}
  const url=`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q+", بغداد, العراق")}&format=json&limit=5&addressdetails=1&accept-language=ar`;
  fetch(url).then(r=>r.json()).then(data=>{
    searchResultsUl.innerHTML='';
    if(data.length>0){
      data.forEach(item=>{
        let li=document.createElement('li');
        let fullArea=item.display_name.split(',').slice(0,3).reverse().join(', '); // العنوان الكامل
        let shortArea=getShortAreaName(fullArea); // العنوان المختصر للعرض
        
        li.innerText=shortArea; // عرض العنوان المختصر
        li.onclick=()=>selectSearchResult(item.lat,item.lon,fullArea); // تمرير العنوان الكامل للدالة
        searchResultsUl.appendChild(li);
      });
      searchResultsUl.style.display='block';
    }else{
      searchResultsUl.innerHTML='<li>لا توجد نتائج.</li>';
      searchResultsUl.style.display='block';
    }
  });
}

function selectSearchResult(lat,lng,name){
  searchResultsUl.innerHTML='';searchResultsUl.style.display='none';
  
  const shortName = getShortAreaName(name); // استخدام الاسم المختصر للعرض
  searchInput.value=shortName;
  endAreaName=name; // تخزين الاسم الكامل لاستخدامه في Firebase

  let latlng=L.latLng(parseFloat(lat),parseFloat(lng));
  if(endMarker) map.removeLayer(endMarker);
  endCoords=[latlng.lat,latlng.lng];
  endMarker=L.marker(endCoords).addTo(map).bindPopup(`🏁 ${shortName}`).openPopup();
  map.setView(endCoords,15);

  if(!rideId){document.getElementById("status").innerHTML=`تم تحديد النهاية: <b>${shortName}</b>`;sendBtn.disabled=false;}
}

searchInput.addEventListener('input',e=>{
  clearTimeout(searchInputTimer);
  searchInputTimer=setTimeout(()=>searchLocation(e.target.value.trim()),SEARCH_DELAY);
});

document.addEventListener('click',e=>{
  if(!searchContainer.contains(e.target)) searchResultsUl.style.display='none';
});

// إرسال الطلب
sendBtn.onclick=function(){
  if(!startCoords||!endCoords){alert("حدد المواقع.");return;}

  const phone=localStorage.getItem('phone');

  const R=6371;
  const dLat=(endCoords[0]-startCoords[0])*Math.PI/180;
  const dLon=(endCoords[1]-startCoords[1])*Math.PI/180;
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+
           Math.cos(startCoords[0]*Math.PI/180)*Math.cos(endCoords[0]*Math.PI/180)*
           Math.sin(dLon/2)*Math.sin(dLon/2);
  const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  const distance=(R*c).toFixed(2);
  const fare=Math.round(distance*1000);

  rideId=Date.now();
  localStorage.setItem('activeRideId',rideId);

  endBtn.style.display='inline-block';
  sendBtn.style.display='none';
  searchContainer.style.display='none';
  
  db.ref("rides/"+rideId).set({
    riderPhone:phone,
    startLat:startCoords[0], startLng:startCoords[1], // تخزين الإحداثيات منفصلة
    endLat:endCoords[0], endLng:endCoords[1],         // تخزين الإحداثيات منفصلة
    startArea:startAreaName,endArea:endAreaName, // استخدام الأسماء الكاملة المخزنة سابقاً
    distance:distance,fare:fare,status:"جديدة"
  });

  const shortStartArea = getShortAreaName(startAreaName);
  const shortEndArea = getShortAreaName(endAreaName);

  // تنسيقات مضافة حديثاً لجعل الأجرة والمسافة بارزة
  const fareStyle = "font-size: 1em; font-weight: bold; color: #E53935;"; 
  const distanceStyle = "font-size: 1em; font-weight: bold; color: #455A64;"; 
  
  // إزالة النجوم وتطبيق التنسيق الداخلي
  document.getElementById("status").innerHTML=
    `تم الإرسال<br>من ${shortStartArea} إلى ${shortEndArea}<br>
     المسافة: <span style="${distanceStyle}">${distance} كم</span> — الأجرة: <span style="${fareStyle}">${fare.toLocaleString('ar-IQ')} د.ع</span>`;
  
  startMonitoringRide(rideId);
};

// إلغاء الطلب
endBtn.onclick=function(){
    if(!rideId) return;

    db.ref("rides/"+rideId).update({status:"ملغاة", canceledBy:"rider"});
    cleanupRide();
    document.getElementById("status").innerHTML=`تم إلغاء الطلب.`;
};

// منع خروج المستخدم
window.onload=function(){
    let phone=localStorage.getItem("phone");
    let userType=localStorage.getItem("userType");

    if(!phone||!userType){window.location.href="index.html";return;}
    if(userType==="driver") window.location.href="driver.html";
    
    // يتم استدعاء startMonitoringRide داخل geolocation listener بعد تحديد الموقع
};

window.logout=function(){
    if(rideRef) rideRef.off();
    if(driverRef) driverRef.off();
    // ⭐⭐ إيقاف المؤقت عند تسجيل الخروج ⭐⭐
    if(driverTrackingInterval) clearInterval(driverTrackingInterval);
    driverTrackingInterval = null;

    localStorage.removeItem('phone');
    localStorage.removeItem('userType');
    localStorage.removeItem('activeRideId');
    window.location.href="index.html";
};

</script>

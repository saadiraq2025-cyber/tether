    <style>
        /* تنسيق الصفحة الأساسي */
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* حاوية اللعبة (الكارت الأصفر) */
        .game-card {
            background: linear-gradient(135deg, #fcdf3e 0%, #ffc107 100%);
            width: 350px;
            height: 600px;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            border: 5px solid #fff;
        }

        /* السؤال */
        .question {
            font-size: 22px;
            font-weight: 900;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.4;
            min-height: 80px;
        }

        /* حاوية الخيارات */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* زر الخيار الواحد */
        .option-btn {
            background: white;
            border: 3px solid #000;
            border-radius: 15px;
            display: flex;
            align-items: center;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover {
            transform: scale(1.02);
        }

        /* صورة الخيار */
        .option-img {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #ddd;
            margin-left: 15px;
        }

        /* نص الخيار */
        .option-text {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            flex-grow: 1;
        }

        /* شريط الوقت */
        .timer-container {
            width: 100%;
            height: 15px;
            background-color: #ddd;
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
            border: 2px solid #fff;
        }

        .timer-bar {
            height: 100%;
            width: 0%;
            background-color: #3b82f6; /* لون أزرق مثل الفيديو */
            transition: width 0.1s linear;
        }

        /* تنسيقات الإجابة الصحيحة والخاطئة */
        .correct {
            background-color: #2ecc71 !important; /* أخضر */
            border-color: #27ae60 !important;
        }

        .correct .option-text {
            color: white;
        }

        .wrong {
            background-color: #e74c3c !important; /* أحمر */
            border-color: #c0392b !important;
            opacity: 0.7;
        }

        /* زر التالي */
        .next-btn {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 15px;
            border: 3px solid #000;
            background-color: #ffffff;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .next-btn:hover {
            transform: scale(1.02);
        }

        /* تأثيرات زخرفية للخلفية (دوائر باهتة) */
        .bg-decoration {
            position: absolute;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            z-index: 0;
        }

        .circle-1 {
            width: 200px;
            height: 200px;
            top: -50px;
            left: -50px;
        }

        .circle-2 {
            width: 150px;
            height: 150px;
            bottom: 50px;
            right: -30px;
        }

        /* لضمان بقاء المحتوى فوق الخلفية الزخرفية */
        .content-wrapper {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .footer-text {
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            margin-top: 5px;
            color: #2c3e50;
        }
    </style>
</head>

                q: "ما هو الشيء الذي يزيد ولا ينقص أبداً ؟",
                options: [
                    { text: "العمر", img: icon2, correct: true },
                    { text: "المال", img: icon1, correct: false },
                    { text: "الوزن", img: icon3, correct: false }
                ]
            },
            {
                q: "شيء موجود في السماء وليس في الماء، ما هو ؟",
                options: [
                    { text: "حرف السين", img: icon1, correct: true },
                    { text: "النجوم", img: icon2, correct: false },
                    { text: "القمر", img: icon3, correct: false }
                ]
            }
        ];

        const progressBar = document.getElementById('progressBar');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const nextBtn = document.getElementById('nextBtn');
        const counterText = document.getElementById('counterText');

        let gameActive = true;
        let progress = 0;
        const totalTime = 5000; // 5 ثواني
        const intervalTime = 50; // تحديث كل 50 ملي ثانية
        let timer = null;
        let currentIndex = 0;
        let correctOptionElement = null;

        // تحميل سؤال معين
        function loadQuestion(index) {
            const q = questions[index];
            questionText.textContent = q.q;
            counterText.textContent = "السؤال " + (index + 1) + " من " + questions.length;

            optionsContainer.innerHTML = "";
            correctOptionElement = null;

            q.options.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';

                const img = document.createElement('img');
                img.src = opt.img;
                img.alt = opt.text;
                img.className = 'option-img';

                const span = document.createElement('span');
                span.className = 'option-text';
                span.textContent = opt.text;

                btn.appendChild(img);
                btn.appendChild(span);

                btn.onclick = () => checkAnswer(btn, opt.correct);

                optionsContainer.appendChild(btn);

                if (opt.correct) {
                    correctOptionElement = btn;
                }
            });

            resetTimer();
        }

        // إعادة ضبط المؤقت
        function resetTimer() {
            clearInterval(timer);
            progress = 0;
            progressBar.style.width = '0%';
            gameActive = true;

            timer = setInterval(() => {
                if (!gameActive) {
                    clearInterval(timer);
                    return;
                }

                progress += (intervalTime / totalTime) * 100;
                progressBar.style.width = progress + '%';

                if (progress >= 100) {
                    clearInterval(timer);
                    revealAnswer(); // كشف الإجابة عند انتهاء الوقت
                }
            }, intervalTime);
        }

        // دالة التحقق من الإجابة عند النقر
        function checkAnswer(element, isCorrect) {
            if (!gameActive) return; // منع النقر المتكرر
            gameActive = false; // إيقاف اللعبة

            if (isCorrect) {
                element.classList.add('correct');
            } else {
                element.classList.add('wrong');
                // إظهار الإجابة الصحيحة أيضاً
                if (correctOptionElement) {
                    setTimeout(() => {
                        correctOptionElement.classList.add('correct');
                    }, 300);
                }
            }
        }

        // دالة كشف الإجابة تلقائياً عند انتهاء الوقت
        function revealAnswer() {
            gameActive = false;
            if (correctOptionElement) {
                correctOptionElement.classList.add('correct');
            }
        }

        // الانتقال إلى السؤال التالي
        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                // انتهت الأسئلة
                clearInterval(timer);
                questionText.textContent = "انتهت جميع الألغاز! أحسنت 👏🎉";
                optionsContainer.innerHTML = "";
                progressBar.style.width = "100%";
                nextBtn.disabled = true;
                nextBtn.textContent = "انتهى اللعب";
                counterText.textContent = "عدد الألغاز: " + questions.length;
            }
        }

        nextBtn.addEventListener('click', nextQuestion);

        // عند تحميل الصفحة نبدأ بالسؤال الأول
        window.onload = function () {
            loadQuestion(0);
        };
    </script>
</body>
</html>

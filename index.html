<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>خريطة حفظ المحلات والأماكن</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
    }
    #map {
        height: 70vh;
    }
    .panel {
        padding: 10px;
        background: white;
    }
    input, button {
        padding: 8px;
        margin: 5px 0;
        width: 100%;
        font-size: 14px;
    }
    ul {
        list-style: none;
        padding: 0;
    }
    li {
        background: #eee;
        margin: 5px 0;
        padding: 8px;
        border-radius: 4px;
        cursor: pointer;
    }
</style>
</head>

<body>

<div id="map"></div>

<div class="panel">
    <input type="text" id="placeName" placeholder="اسم المحلة أو المكان">
    <button onclick="savePlace()">💾 حفظ المكان</button>

    <h3>📌 الأماكن المحفوظة</h3>
    <ul id="placesList"></ul>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map = L.map('map').setView([33.3152, 44.3661], 12); // بغداد افتراضياً
let selectedMarker = null;
let places = JSON.parse(localStorage.getItem("savedPlaces")) || [];

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

// عند الضغط على الخريطة
map.on('click', function(e) {
    if (selectedMarker) {
        map.removeLayer(selectedMarker);
    }
    selectedMarker = L.marker(e.latlng).addTo(map);
});

// حفظ المكان
function savePlace() {
    if (!selectedMarker) {
        alert("حدد مكاناً على الخريطة أولاً");
        return;
    }
    let name = document.getElementById("placeName").value;
    if (!name) {
        alert("اكتب اسم المحلة أو المكان");
        return;
    }

    let place = {
        name: name,
        lat: selectedMarker.getLatLng().lat,
        lng: selectedMarker.getLatLng().lng
    };

    places.push(place);
    localStorage.setItem("savedPlaces", JSON.stringify(places));
    document.getElementById("placeName").value = "";
    loadPlaces();
}

// تحميل الأماكن المحفوظة
function loadPlaces() {
    let list = document.getElementById("placesList");
    list.innerHTML = "";

    places.forEach((p, index) => {
        let li = document.createElement("li");
        li.textContent = p.name;
        li.onclick = () => {
            map.setView([p.lat, p.lng], 16);
            L.marker([p.lat, p.lng]).addTo(map)
             .bindPopup(p.name).openPopup();
        };
        list.appendChild(li);
    });
}

// عرض الأماكن عند الفتح
loadPlaces();
</script>

</body>
</html>

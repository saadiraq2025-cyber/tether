<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>منصة تعليمية</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
    background:#f2f2f2;
    font-family:tahoma;
    padding:20px;
}
.card{
    background:#fff;
    padding:20px;
    border-radius:10px;
    max-width:420px;
    margin:auto;
    box-shadow:0 0 10px #ccc;
}
input, select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #bbb;
    border-radius:6px;
}
button{
    width:100%;
    padding:12px;
    background:#2b7cff;
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:18px;
}
</style>
</head>
<body>

<div class="card">
<h2 style="text-align:center">منصة التعليم</h2>

<select id="role">
    <option value="teacher">مدرّس</option>
    <option value="student">طالب</option>
</select>

<input id="phone" placeholder="رقم الهاتف">
<input id="pass" type="password" placeholder="كلمة المرور">

<button onclick="login()">دخول</button>
</div>

<script>
function login(){
    let phone = document.getElementById("phone").value;
    let pass  = document.getElementById("pass").value;
    let role  = document.getElementById("role").value;

    if(phone==="" || pass===""){
        alert("أدخل جميع الحقول");
        return;
    }

    localStorage.setItem("userPhone", phone);
    localStorage.setItem("userRole", role);

    // المدرّس
    if(role === "teacher"){
        window.location = "teacher.html";
        return;
    }

    // الطالب
    if(role === "student"){
        window.location = "student.html";
        return;
    }
}
</script>

</body>
</html>

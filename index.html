<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مسابقة دينية للأطفال</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f5f5f5;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    max-width:500px;
    margin:auto;
}

button{
    display:block;
    width:100%;
    margin:10px 0;
    padding:12px;
    font-size:16px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#4CAF50;
    color:white;
}

button:hover{
    background:#45a049;
}

#timer{
    font-size:22px;
    color:red;
    margin:10px;
}

#result{
    font-size:20px;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="card">
<h2 id="question"></h2>

<div id="timer">30</div>

<div id="answers"></div>

<div id="result"></div>

<button onclick="nextQuestion()">سؤال جديد</button>
</div>

<script>
const quiz = [
{
q:"من هو أول إمام عند الشيعة؟",
a:["علي بن أبي طالب","الحسن","الحسين"],
correct:0
},
{
q:"في أي شهر استشهد الإمام الحسين؟",
a:["رمضان","محرم","صفر"],
correct:1
},
{
q:"من هي أم الإمام الحسن والحسين؟",
a:["فاطمة الزهراء","زينب","خديجة"],
correct:0
}
];

let current;
let time;
let timer;

function startTimer(){
time = 30;
document.getElementById("timer").textContent = time;

timer = setInterval(()=>{
time--;
document.getElementById("timer").textContent = time;

if(time === 0){
clearInterval(timer);
document.getElementById("result").textContent="⏰ انتهى الوقت!";
disableButtons();
}
},1000);
}

function loadQuestion(){
clearInterval(timer);
document.getElementById("result").textContent="";

current = quiz[Math.floor(Math.random()*quiz.length)];
document.getElementById("question").textContent=current.q;

const answersDiv=document.getElementById("answers");
answersDiv.innerHTML="";

current.a.forEach((ans,i)=>{
let btn=document.createElement("button");
btn.textContent=ans;
btn.onclick=()=>checkAnswer(i);
answersDiv.appendChild(btn);
});

startTimer();
}

function checkAnswer(i){
clearInterval(timer);

if(i===current.correct){
document.getElementById("result").textContent="✅ إجابة صحيحة!";
}else{
document.getElementById("result").textContent="❌ حاول مرة أخرى!";
}

disableButtons();
}

function disableButtons(){
document.querySelectorAll("#answers button")
.forEach(b=>b.disabled=true);
}

function nextQuestion(){
loadQuestion();
}

loadQuestion();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لغز الألغاز</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* تنسيق الصفحة الأساسي */
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* حاوية اللعبة (الكارت الأصفر) */
        .game-card {
            background: linear-gradient(135deg, #fcdf3e 0%, #ffc107 100%);
            width: 350px;
            height: 600px;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            border: 5px solid #fff;
        }

        /* السؤال */
        .question {
            font-size: 22px;
            font-weight: 900;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* حاوية الخيارات */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* زر الخيار الواحد */
        .option-btn {
            background: white;
            border: 3px solid #000;
            border-radius: 15px;
            display: flex;
            align-items: center;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover {
            transform: scale(1.02);
        }

        /* صورة الخيار */
        .option-img {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #ddd;
            margin-left: 15px;
        }

        /* نص الخيار */
        .option-text {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            flex-grow: 1;
        }

        /* شريط الوقت */
        .timer-container {
            width: 100%;
            height: 15px;
            background-color: #ddd;
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
            border: 2px solid #fff;
        }

        .timer-bar {
            height: 100%;
            width: 0%;
            background-color: #3b82f6; /* لون أزرق مثل الفيديو */
            transition: width 0.1s linear;
        }

        /* تنسيقات الإجابة الصحيحة والخاطئة */
        .correct {
            background-color: #2ecc71 !important; /* أخضر */
            border-color: #27ae60 !important;
            color: white;
        }
        
        .correct .option-text { color: white; }

        .wrong {
            background-color: #e74c3c !important; /* أحمر */
            border-color: #c0392b !important;
            opacity: 0.7;
        }

        /* تأثيرات زخرفية للخلفية (دوائر باهتة) */
        .bg-decoration {
            position: absolute;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            z-index: 0;
        }
        .circle-1 { width: 200px; height: 200px; top: -50px; left: -50px; }
        .circle-2 { width: 150px; height: 150px; bottom: 50px; right: -30px; }

        /* لضمان بقاء المحتوى فوق الخلفية الزخرفية */
        .content-wrapper {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

    </style>
</head>
<body>

    <div class="game-card">
        <div class="bg-decoration circle-1"></div>
        <div class="bg-decoration circle-2"></div>

        <div class="content-wrapper">
            <div class="question">
                ما هو الشيء الذي يستطيع رفع أثقل الأشياء ولا يستطيع رفع مسمار ؟
            </div>

            <div class="timer-container">
                <div class="timer-bar" id="progressBar"></div>
            </div>
            <br>

            <div class="options-container">
                <div class="option-btn" onclick="checkAnswer(this, false)">
                    <img src="https://cdn-icons-png.flaticon.com/512/2311/2311451.png" class="option-img" alt="شاحنة">
                    <span class="option-text">الشاحنة</span>
                </div>

                <div class="option-btn" id="correctAnswer" onclick="checkAnswer(this, true)">
                    <img src="https://cdn-icons-png.flaticon.com/512/2867/2867882.png" class="option-img" alt="البحر">
                    <span class="option-text">البحر</span>
                </div>

                <div class="option-btn" onclick="checkAnswer(this, false)">
                    <img src="https://cdn-icons-png.flaticon.com/512/2548/2548530.png" class="option-img" alt="لاعب أجسام">
                    <span class="option-text">لاعب أجسام</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const progressBar = document.getElementById('progressBar');
        const correctOption = document.getElementById('correctAnswer');
        let gameActive = true;
        let progress = 0;
        const totalTime = 5000; // 5 ثواني
        const intervalTime = 50; // تحديث كل 50 ملي ثانية

        // دالة تشغيل المؤقت
        const timer = setInterval(() => {
            if (!gameActive) {
                clearInterval(timer);
                return;
            }

            progress += (intervalTime / totalTime) * 100;
            progressBar.style.width = progress + '%';

            if (progress >= 100) {
                clearInterval(timer);
                revealAnswer(); // كشف الإجابة عند انتهاء الوقت
            }
        }, intervalTime);

        // دالة التحقق من الإجابة عند النقر
        function checkAnswer(element, isCorrect) {
            if (!gameActive) return; // منع النقر المتكرر
            gameActive = false; // إيقاف اللعبة

            if (isCorrect) {
                element.classList.add('correct');
            } else {
                element.classList.add('wrong');
                // إظهار الإجابة الصحيحة أيضاً
                setTimeout(() => {
                    correctOption.classList.add('correct');
                }, 300);
            }
        }

        // دالة كشف الإجابة تلقائياً عند انتهاء الوقت
        function revealAnswer() {
            gameActive = false;
            correctOption.classList.add('correct');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسابقة الأبطال الناطقين</title>
    <style>
        :root { --main-bg: #fdf6e3; --primary: #2e7d32; --accent: #ff9800; --danger: #d32f2f; }
        body { font-family: 'Cairo', sans-serif; background: var(--main-bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .game-card { background: white; width: 90%; max-width: 600px; padding: 30px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); border: 8px solid #a5d6a7; text-align: center; }
        .timer-box { width: 80px; height: 80px; border-radius: 50%; border: 6px solid var(--primary); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; margin: 0 auto 20px; color: var(--primary); background: #f1f8e9; }
        .timer-low { border-color: var(--danger); color: var(--danger); animation: shake 0.5s infinite; }
        @keyframes shake { 0% { transform: rotate(0deg); } 25% { transform: rotate(5deg); } 75% { transform: rotate(-5deg); } 100% { transform: rotate(0deg); } }
        .q-text { font-size: 26px; color: #333; margin-bottom: 25px; min-height: 80px; display: flex; align-items: center; justify-content: center; font-weight: 800; }
        .options-list { display: grid; gap: 15px; }
        .btn-opt { background: #f1f8e9; border: 3px solid #c8e6c9; padding: 18px; border-radius: 20px; font-size: 20px; cursor: pointer; transition: 0.2s; font-weight: 700; color: #2e7d32; }
        .btn-opt:hover { background: #e8f5e9; border-color: var(--primary); }
        .correct { background: #4caf50 !important; color: white !important; }
        .wrong { background: #ef5350 !important; color: white !important; }
        .score-board { margin-top: 25px; display: flex; justify-content: space-between; font-weight: bold; color: #666; font-size: 18px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="game-card" id="game-wrap">
    <div id="start-area">
        <img src="https://cdn-icons-png.flaticon.com/512/3940/3940403.png" style="width: 150px;">
        <h1 style="color: var(--primary);">مغامرة المعرفة الإسلامية</h1>
        <p style="font-size: 18px;">40 سؤالاً ممتعاً مع خاصية نطق الأسئلة!</p>
        <button class="btn-opt" style="background: var(--accent); color: white; border: none; width: 220px;" onclick="begin()">ابدأ اللعب واستمع 🔊</button>
    </div>

    <div id="quiz-area" style="display:none;">
        <div class="timer-box" id="timer">15</div>
        <div class="q-text" id="question">جاري التحميل...</div>
        <div class="options-list" id="options"></div>
        <div class="score-board">
            <span>النقاط: <span id="pts">0</span></span>
            <span>السؤال: <span id="prog">1</span> / 40</span>
        </div>
    </div>
</div>

<audio id="sound-tick" src="https://www.soundjay.com/buttons/sounds/button-20.mp3"></audio>
<audio id="sound-win" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="sound-fail" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

<script>
const data = [
    { q: "من هو أول أئمة أهل البيت عليهم السلام؟", a: ["الإمام علي (ع)", "الإمام الحسن (ع)", "الإمام الحسين (ع)"], c: 0 },
    { q: "كم عدد الأئمة المعصومين عليهم السلام؟", a: ["عشرة", "إثنا عشر", "أربعة عشر"], c: 1 },
    { q: "من هي سيدة نساء العالمين؟", a: ["السيدة خديجة", "السيدة مريم", "فاطمة الزهراء (ع)"], c: 2 },
    { q: "ما هو لقب الإمام الثامن علي بن موسى (ع)؟", a: ["الرضا", "الجواد", "الهادي"], c: 0 },
    { q: "من هو النبي الذي بنى الكعبة؟", a: ["إبراهيم (ع)", "يوسف (ع)", "نوح (ع)"], c: 0 },
    { q: "ما اسم والد الإمام الحسين (ع)؟", a: ["حمزة", "علي بن أبي طالب (ع)", "العباس"], c: 1 },
    { q: "أين ولد الإمام علي (ع)؟", a: ["في مكة", "في جوف الكعبة", "في المدينة"], c: 1 },
    { q: "من هو الإمام الغائب الذي ننتظر ظهوره؟", a: ["الإمام المهدي (عج)", "الإمام العسكري", "الإمام الهادي"], c: 0 },
    { q: "كم عدد ركعات صلاة الصبح؟", a: ["3 ركعات", "ركعتان", "4 ركعات"], c: 1 },
    { q: "ماذا نقول في السجود؟", a: ["سبحان ربي العظيم", "سبحان ربي الأعلى", "الحمد لله"], c: 1 },
    { q: "من هو الإمام الذي يلقب بـ زين العابدين؟", a: ["الإمام السجاد", "الإمام الصادق", "الإمام الباقر"], c: 0 },
    { q: "في أي شهر نصوم؟", a: ["شوال", "رجب", "رمضان"], c: 2 },
    { q: "من هو بطل كربلاء الذي جلب الماء؟", a: ["علي الأكبر", "أبا الفضل العباس", "القاسم"], c: 1 },
    { q: "ما هو لقب الإمام الخامس محمد بن علي (ع)؟", a: ["الباقر", "الصادق", "الكاظم"], c: 0 },
    { q: "ما اسم أم الإمام الحسين (ع)؟", a: ["أم البنين", "فاطمة الزهراء (ع)", "زينب"], c: 1 },
    { q: "من هو الإمام السادس؟", a: ["الإمام الصادق", "الإمام الجواد", "الإمام الرضا"], c: 0 },
    { q: "ما هو أول أصل من أصول الدين؟", a: ["العدل", "النبوة", "التوحيد"], c: 2 },
    { q: "أين يقع مرقد الإمام علي (ع)؟", a: ["كربلاء", "النجف الأشرف", "سامراء"], c: 1 },
    { q: "ما اسم ابن الإمام الحسين الرضيع؟", a: ["عبد الله", "علي الأكبر", "جعفر"], c: 0 },
    { q: "من هي ابنة النبي محمد (ص)؟", a: ["زينب", "رقية", "فاطمة الزهراء"], c: 2 },
    { q: "من هو النبي الذي كلم الله؟", a: ["عيسى (ع)", "موسى (ع)", "داوود (ع)"], c: 1 },
    { q: "كم عدد أصول الدين؟", a: ["3", "5", "10"], c: 1 },
    { q: "ما هو لقب الإمام الكاظم (ع)؟", a: ["باب الحوائج", "غريب طوس", "أبو تراب"], c: 0 },
    { q: "من هو الإمام الملقب بالجواد؟", a: ["الإمام التاسع", "الإمام العاشر", "الإمام الثامن"], c: 0 },
    { q: "أين استشهد الإمام الحسين (ع)؟", a: ["الكوفة", "كربلاء", "المدينة"], c: 1 },
    { q: "ما هو الكتاب الذي نزل على النبي محمد (ص)؟", a: ["التوراة", "القرآن", "الإنجيل"], c: 1 },
    { q: "من هو عم النبي الذي استشهد في أحد؟", a: ["أبو طالب", "حمزة", "العباس"], c: 1 },
    { q: "ما هي عاصمة الإمام علي (ع)؟", a: ["البصرة", "الكوفة", "مكة"], c: 1 },
    { q: "كم عدد فروع الدين؟", a: ["5", "10", "12"], c: 1 },
    { q: "من هو الإمام الذي ولد في 15 رمضان؟", a: ["الإمام الحسن (ع)", "الإمام الحسين (ع)", "الإمام السجاد"], c: 0 },
    { q: "من هي أخت الإمام الحسين في كربلاء؟", a: ["زينب الكبرى", "سكينة", "فاطمة"], c: 0 },
    { q: "ما هو لقب الإمام العاشر؟", a: ["الهادي", "العسكري", "الرضا"], c: 0 },
    { q: "كم عدد ركعات صلاة المغرب؟", a: ["2", "4", "3"], c: 2 },
    { q: "ما هو أول فرع من فروع الدين؟", a: ["الصوم", "الصلاة", "الجهاد"], c: 1 },
    { q: "من هو والد الإمام علي (ع)؟", a: ["عبد المطلب", "أبو طالب", "حمزة"], c: 1 },
    { q: "ما هو لقب الإمام الحادي عشر؟", a: ["العسكري", "الهادي", "الجواد"], c: 0 },
    { q: "من هو النبي الذي عاش في زمن نمرود؟", a: ["إبراهيم (ع)", "لوط (ع)", "يحيى (ع)"], c: 0 },
    { q: "أين يقع مرقد الإمام الرضا (ع)؟", a: ["طهران", "مشهد", "قم"], c: 1 },
    { q: "ماذا نقول في الركوع؟", a: ["سبحان ربي العظيم", "سبحان ربي الأعلى", "الله أكبر"], c: 0 },
    { q: "من هو الإمام الذي سيظهر لينشر العدل؟", a: ["الإمام المهدي (عج)", "الإمام الهادي", "الإمام الصادق"], c: 0 }
];

let idx = 0; let score = 0; let timer; let sec = 15;

function speak(text) {
    window.speechSynthesis.cancel();
    let utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ar-SA';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
}

function begin() {
    document.getElementById('start-area').style.display = 'none';
    document.getElementById('quiz-area').style.display = 'block';
    load();
}

function load() {
    if (idx >= data.length) { finish(); return; }
    sec = 15;
    document.getElementById('timer').innerText = sec;
    document.getElementById('timer').classList.remove('timer-low');
    document.getElementById('prog').innerText = idx + 1;
    
    const q = data[idx];
    document.getElementById('question').innerText = q.q;
    speak(q.q); // نطق السؤال
    
    const container = document.getElementById('options');
    container.innerHTML = "";
    q.a.forEach((opt, i) => {
        const b = document.createElement('button');
        b.className = 'btn-opt';
        b.innerText = opt;
        b.onclick = () => check(i);
        container.appendChild(b);
    });
    
    clearInterval(timer);
    timer = setInterval(() => {
        sec--;
        document.getElementById('timer').innerText = sec;
        document.getElementById('sound-tick').play();
        if(sec <= 5) document.getElementById('timer').classList.add('timer-low');
        if(sec <= 0) { clearInterval(timer); check(-1); }
    }, 1000);
}

function check(choice) {
    clearInterval(timer);
    const q = data[idx];
    const btns = document.querySelectorAll('.btn-opt');
    
    if (choice === q.c) {
        score++;
        document.getElementById('pts').innerText = score;
        if(choice !== -1) btns[choice].classList.add('correct');
        document.getElementById('sound-win').play();
    } else {
        if(choice !== -1) btns[choice].classList.add('wrong');
        btns[q.c].classList.add('correct');
        document.getElementById('sound-fail').play();
    }
    
    idx++;
    setTimeout(load, 2500);
}

function finish() {
    document.getElementById('game-wrap').innerHTML = `
        <h2 style="color:var(--primary)">انتهت المسابقة! 🎉</h2>
        <p style="font-size:28px">لقد حصلت على ${score} من 40</p>
        <button class="btn-opt" onclick="location.reload()">إعادة التحدي 🔄</button>
    `;
    speak("انتهت المسابقة. لقد حصلت على " + score + " من أربعين.");
}
</script>
</body>
</html>

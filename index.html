<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>اللعبة الدينية الاحترافية</title>

<style>
body{
font-family:Arial;
background:linear-gradient(#6dd5fa,#ffffff);
text-align:center;
padding:10px;
}

.card{
background:white;
max-width:520px;
margin:auto;
padding:20px;
border-radius:20px;
box-shadow:0 0 15px rgba(0,0,0,0.2);
}

button{
width:100%;
padding:14px;
margin:6px 0;
font-size:16px;
border:none;
border-radius:12px;
cursor:pointer;
background:#4CAF50;
color:white;
}

.avatar{font-size:60px}

#timer{font-size:22px;color:red}
</style>
</head>

<body>

<div class="card">

<h2 id="stageTitle"></h2>

<div class="avatar" id="avatar">🙂</div>

<h3 id="question"></h3>

<div id="timer"></div>
<div id="score"></div>

<div id="answers"></div>

<div id="result"></div>

</div>

<script>
const avatars=["🙂","😎","🤓","🧒","👧"];

const sounds={
correct:new Audio("https://actions.google.com/sounds/v1/cartoon/clang.ogg"),
wrong:new Audio("https://actions.google.com/sounds/v1/cartoon/boing.ogg")
};

// ===== توليد 20 سؤال لكل مرحلة =====
function generateStage(){
let arr=[];
for(let i=1;i<=20;i++){
arr.push({
q:"سؤال ديني رقم "+i,
a:["خيار 1","خيار 2","خيار 3"],
c:Math.floor(Math.random()*3)
});
}
return arr;
}

const stages=[
generateStage(),
generateStage(),
generateStage()
];

let stageIndex=0;
let questions=[];
let current;
let score=0;
let timer,time;

function changeAvatar(){
document.getElementById("avatar").textContent=
avatars[Math.floor(Math.random()*avatars.length)];
}

function startStage(){
questions=[...stages[stageIndex]];
document.getElementById("stageTitle").textContent=
"⭐ المرحلة "+(stageIndex+1);
loadQuestion();
}

function startTimer(){
time=10;
updateTimer();

timer=setInterval(()=>{
time--;
updateTimer();

if(time<=0){
clearInterval(timer);
showResult("⏰ انتهى الوقت!");
disableButtons();
setTimeout(loadQuestion,1200);
}
},1000);
}

function updateTimer(){
document.getElementById("timer").textContent="⏱ "+time;
}

function loadQuestion(){
clearInterval(timer);
document.getElementById("result").textContent="";
changeAvatar();

if(questions.length===0){
stageIndex++;

if(stageIndex>=stages.length){
alert("🎉 انتهت اللعبة! نقاطك: "+score);
location.reload();
return;
}

alert("🚀 المرحلة التالية!");
startStage();
return;
}

current=questions.splice(Math.random()*questions.length|0,1)[0];

document.getElementById("question").textContent=current.q;

const answers=document.getElementById("answers");
answers.innerHTML="";

current.a.forEach((ans,i)=>{
let btn=document.createElement("button");
btn.textContent=ans;
btn.onclick=()=>checkAnswer(i);
answers.appendChild(btn);
});

startTimer();
}

function checkAnswer(i){
clearInterval(timer);

if(i===current.c){
score++;
sounds.correct.play();
showResult("✅ صحيح!");
}else{
sounds.wrong.play();
showResult("❌ خطأ!");
}

updateScore();
disableButtons();
setTimeout(loadQuestion,1200);
}

function showResult(msg){
document.getElementById("result").textContent=msg;
}

function disableButtons(){
document.querySelectorAll("#answers button")
.forEach(b=>b.disabled=true);
}

function updateScore(){
document.getElementById("score").textContent="⭐ النقاط: "+score;
}

startStage();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسابقة الأبطال الصغار</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e0f7fa; text-align: center; padding: 20px; }
        .quiz-container { background: white; max-width: 500px; margin: auto; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); border: 4px solid #4fc3f7; }
        .character { width: 150px; height: 150px; margin-bottom: 20px; border-radius: 50%; }
        .question { font-size: 24px; color: #0277bd; margin-bottom: 20px; font-weight: bold; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; cursor: pointer; border: none; border-radius: 10px; transition: 0.3s; background-color: #81d4fa; color: white; font-weight: bold; }
        .btn:hover { background-color: #29b6f6; transform: scale(1.02); }
        #feedback { font-size: 22px; font-weight: bold; margin-top: 20px; min-height: 30px; }
        .score { font-size: 18px; color: #555; margin-top: 10px; }
    </style>
</head>
<body>

<div class="quiz-container">
    <img src="https://cdn-icons-png.flaticon.com/512/4392/4392465.png" alt="شخصية كرتونية" class="character" id="char-img">
    
    <div id="quiz-box">
        <div class="question" id="question-text">تحميل السؤال...</div>
        <div id="options-container"></div>
        <div id="feedback"></div>
        <div class="score">النتيجة: <span id="score-val">0</span></div>
    </div>
</div>

<audio id="correct-sound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>
<audio id="wrong-sound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

<script>
    const quizData = [
        { q: "من هو أول أئمة أهل البيت عليهم السلام؟", a: ["الإمام علي (ع)", "الإمام الحسن (ع)", "الإمام الحسين (ع)"], correct: 0 },
        { q: "كم عدد الأئمة المعصومين عليهم السلام؟", a: ["10 أئمة", "12 إماماً", "14 إماماً"], correct: 1 },
        { q: "ما هو لقب الإمام الثامن علي بن موسى (ع)؟", a: ["الجواد", "الرضا", "الكاظم"], correct: 1 },
        { q: "من هي سيدة نساء العالمين؟", a: ["السيدة خديجة", "السيدة زينب", "السيدة فاطمة الزهراء"], correct: 2 }
    ];

    let currentIdx = 0;
    let score = 0;

    function loadQuestion() {
        const qBox = document.getElementById("question-text");
        const optBox = document.getElementById("options-container");
        const feedback = document.getElementById("feedback");
        
        feedback.innerHTML = "";
        optBox.innerHTML = "";
        
        let currentQ = quizData[currentIdx];
        qBox.innerText = currentQ.q;

        currentQ.a.forEach((option, i) => {
            const button = document.createElement("button");
            button.innerText = option;
            button.classList.add("btn");
            button.onclick = () => checkAnswer(i);
            optBox.appendChild(button);
        });
    }

    function checkAnswer(selected) {
        const feedback = document.getElementById("feedback");
        const correctSound = document.getElementById("correct-sound");
        const wrongSound = document.getElementById("wrong-sound");

        if (selected === quizData[currentIdx].correct) {
            feedback.innerHTML = "✅ أحسنت! إجابة صحيحة يا بطل";
            feedback.style.color = "green";
            score++;
            document.getElementById("score-val").innerText = score;
            correctSound.play();
        } else {
            feedback.innerHTML = "❌ حاول مرة أخرى، أنت تستطيع!";
            feedback.style.color = "red";
            wrongSound.play();
        }

        setTimeout(() => {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                document.getElementById("quiz-box").innerHTML = `<h2>انتهت اللعبة! 🎉</h2> <p>لقد جمعت ${score} من ${quizData.length}</p> <button class='btn' onclick='location.reload()'>إعادة اللعب</button>`;
            }
        }, 2000);
    }

    loadQuestion();
</script>

</body>
</html>

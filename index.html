<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تيك توك ويب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #fe2c55;
            --dark: #121212;
            --text: #ffffff;
            --gray: #888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--dark);
            color: var(--text);
            overflow: hidden; /* لمنع التمرير العام */
            height: 100vh;
        }

        /* --- شاشة تسجيل الدخول --- */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .login-box h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #25f4ee, #fe2c55);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            background: #333;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* --- واجهة التطبيق الرئيسية --- */
        #app-container {
            display: none; /* مخفي حتى تسجيل الدخول */
            height: 100vh;
            width: 100%;
            position: relative;
        }

        /* حاوية الفيديوهات */
        .video-feed {
            height: 100%;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory; /* سر التمرير مثل تيكتوك */
            scrollbar-width: none;
        }
        
        .video-feed::-webkit-scrollbar { 
            display: none; 
        }

        .video-card {
            height: 100vh;
            width: 100%;
            position: relative;
            scroll-snap-align: start;
            background: #000;
        }

        .video-player {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* الطبقات فوق الفيديو */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.6), transparent 30%);
            pointer-events: none;
        }

        /* القائمة الجانبية (لايك، تعليق) */
        .sidebar {
            position: absolute;
            left: 10px; /* لليسار لأن الاتجاه RTL */
            bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            pointer-events: auto;
            z-index: 10;
        }

        .sidebar-item {
            text-align: center;
        }

        .sidebar-btn {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1); /* شفافية خفيفة */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        .sidebar-btn.liked {
            color: var(--primary);
            animation: pop 0.3s ease;
        }

        .sidebar-text {
            font-size: 12px;
            font-weight: 600;
            text-shadow: 1px 1px 2px black;
        }

        /* معلومات الفيديو */
        .video-info {
            position: absolute;
            right: 10px;
            bottom: 80px;
            width: 70%;
            text-align: right;
            pointer-events: auto;
            z-index: 10;
            text-shadow: 1px 1px 2px black;
        }

        .username {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .description {
            font-size: 14px;
            line-height: 1.4;
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: #000;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 20;
        }

        .nav-item {
            color: #888;
            font-size: 20px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #fff;
        }

        .add-btn {
            width: 45px;
            height: 30px;
            background: linear-gradient(to right, #25f4ee, #fe2c55);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white; /* تأكدنا أن اللون أبيض */
            border: 2px solid white; /* حدود بيضاء لجعلها تشبه الأيقونة الأصلية */
        }
        
        .add-btn i {
             color: #000; /* علامة الزائد سوداء */
        }

        /* نافذة التعليقات */
        .comments-modal {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 60%;
            background: #1a1a1a;
            border-radius: 20px 20px 0 0;
            z-index: 100;
            transition: bottom 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .comments-modal.show {
            bottom: 0;
        }

        .comments-header {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #333;
            position: relative;
        }

        .close-comments {
            position: absolute;
            left: 15px;
            top: 15px;
            cursor: pointer;
        }

        .comments-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .comment-item {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .avatar {
            width: 35px;
            height: 35px;
            background: #555;
            border-radius: 50%;
        }

        .comment-content h4 {
            font-size: 12px;
            color: #ccc;
        }
        .comment-content p {
            font-size: 14px;
        }

        .comment-input-area {
            padding: 10px;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }

        .comment-input-area input {
            flex: 1;
            background: #333;
            border: none;
            padding: 10px;
            border-radius: 20px;
            color: white;
            outline: none;
        }

        .send-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        
        /* أيقونة الموسيقى الدوارة */
        .disc-area {
            position: absolute;
            left: 10px;
            bottom: 20px;
            z-index: 10;
        }
        
        .disc {
            width: 50px;
            height: 50px;
            background: #222;
            border-radius: 50%;
            border: 8px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spin 5s linear infinite;
        }
        
        .disc i {
            font-size: 20px;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1>TikTok</h1>
            <p style="margin-bottom: 20px; color: #aaa;">سجل دخولك للمتابعة</p>
            
            <div class="input-group">
                <input type="email" id="email" placeholder="البريد الإلكتروني">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="كلمة المرور">
            </div>
            
            <button class="login-btn" onclick="handleLogin()">تسجيل الدخول</button>
        </div>
    </div>

    <div id="app-container">
        
        <div class="video-feed" id="feed">
            </div>

        <div class="bottom-nav">
            <div class="nav-item active"><i class="fas fa-home"></i></div>
            <div class="nav-item"><i class="fas fa-user-friends"></i></div>
            <div class="add-btn"><i class="fas fa-plus"></i></div>
            <div class="nav-item"><i class="fas fa-inbox"></i></div>
            <div class="nav-item"><i class="fas fa-user"></i></div>
        </div>

        <div class="comments-modal" id="commentsModal">
            <div class="comments-header">
                <h3>التعليقات (<span id="commentCountDisplay">0</span>)</h3>
                <span class="close-comments" onclick="toggleComments()"><i class="fas fa-times"></i></span>
            </div>
            <div class="comments-list" id="commentsList">
                </div>
            <div class="comment-input-area">
                <input type="text" id="commentInput" placeholder="أضف تعليقاً لطيفاً...">
                <button class="send-btn" onclick="addComment()">نشر</button>
            </div>
        </div>

    </div>

    <script>
        // بيانات وهمية للفيديوهات (روابط مجانية للاختبار)
        const videos = [
            {
                src: "https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-sign-1232-large.mp4",
                user: "NeonGirl_2024",
                desc: "أجواء المدينة ليلاً 🌃✨ #night #vibes",
                likes: 1200,
                comments: 45,
                shares: 10
            },
            {
                src: "https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-1173-large.mp4",
                user: "NatureLover",
                desc: "الربيع وصل! 🌸🌳 #طبيعة #جمال",
                likes: 3500,
                comments: 120,
                shares: 300
            },
            {
                src: "https://assets.mixkit.co/videos/preview/mixkit-waves-in-the-water-1164-large.mp4",
                user: "SeaVibes",
                desc: "صوت البحر راحة نفسية 🌊💙 #بحر #هدوء",
                likes: 890,
                comments: 20,
                shares: 5
            }
        ];

        // --- دوال تسجيل الدخول ---
        function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (email && password) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                loadVideos(); // تحميل الفيديوهات
            } else {
                alert("يرجى إدخال البريد وكلمة السر (أي شيء للاختبار)");
            }
        }

        // --- دوال إنشاء الفيديوهات ---
        function loadVideos() {
            const feed = document.getElementById('feed');
            
            videos.forEach((video, index) => {
                const videoCard = document.createElement('div');
                videoCard.className = 'video-card';
                videoCard.innerHTML = `
                    <video class="video-player" src="${video.src}" loop playsinline onclick="togglePlay(this)"></video>
                    <div class="overlay"></div>
                    
                    <div class="video-info">
                        <div class="username">@${video.user}</div>
                        <div class="description">${video.desc}</div>
                    </div>

                    <div class="sidebar">
                        <div class="sidebar-item">
                            <div class="sidebar-btn" onclick="toggleLike(this)">
                                <i class="fas fa-heart"></i>
                            </div>
                            <span class="sidebar-text">${video.likes}</span>
                        </div>
                        <div class="sidebar-item">
                            <div class="sidebar-btn" onclick="toggleComments(${index})">
                                <i class="fas fa-comment-dots"></i>
                            </div>
                            <span class="sidebar-text">${video.comments}</span>
                        </div>
                        <div class="sidebar-item">
                            <div class="sidebar-btn" onclick="shareVideo()">
                                <i class="fas fa-share"></i>
                            </div>
                            <span class="sidebar-text">${video.shares}</span>
                        </div>
                    </div>
                    
                    <div class="disc-area">
                        <div class="disc">
                           <i class="fas fa-music"></i>
                        </div>
                    </div>
                `;
                feed.appendChild(videoCard);
            });

            // تشغيل الفيديو الأول تلقائياً
            const firstVideo = document.querySelector('video');
            if(firstVideo) firstVideo.play();
        }

        // --- التحكم في التشغيل ---
        function togglePlay(video) {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        // مراقب التمرير لتشغيل الفيديو الظاهر فقط
        document.addEventListener('DOMContentLoaded', () => {
             const feed = document.getElementById('feed');
             
             feed.addEventListener('scroll', () => {
                 const videosElements = document.querySelectorAll('video');
                 videosElements.forEach(video => {
                     const rect = video.getBoundingClientRect();
                     // إذا كان الفيديو في منتصف الشاشة تقريباً
                     if (rect.top >= -100 && rect.bottom <= (window.innerHeight + 100)) {
                         video.play();
                     } else {
                         video.pause();
                         video.currentTime = 0; // إعادة الفيديو للبداية
                     }
                 });
             });
        });

        // --- التفاعلات ---
        function toggleLike(btn) {
            btn.classList.toggle('liked');
            let countSpan = btn.nextElementSibling;
            let count = parseInt(countSpan.innerText);
            
            if (btn.classList.contains('liked')) {
                countSpan.innerText = count + 1;
            } else {
                countSpan.innerText = count - 1;
            }
        }

        function shareVideo() {
            if (navigator.share) {
                navigator.share({
                    title: 'فيديو رائع',
                    text: 'شاهد هذا الفيديو على تطبيقنا!',
                    url: window.location.href
                });
            } else {
                alert("تم نسخ الرابط للحافظة!");
            }
        }

        // --- التعليقات ---
        let currentVideoIndex = 0;

        function toggleComments(index) {
            const modal = document.getElementById('commentsModal');
            modal.classList.toggle('show');
            
            if (typeof index !== 'undefined') {
                currentVideoIndex = index;
                // هنا يمكن تحميل تعليقات الفيديو المحدد
                // سنقوم بمسح القائمة الحالية وإضافة تعليقات وهمية
                const list = document.getElementById('commentsList');
                list.innerHTML = `
                    <div class="comment-item">
                        <div class="avatar"></div>
                        <div class="comment-content">
                            <h4>User123</h4>
                            <p>فيديو رائع جداً! 😍</p>
                        </div>
                    </div>
                     <div class="comment-item">
                        <div class="avatar" style="background:blue;"></div>
                        <div class="comment-content">
                            <h4>Ahmed_IQ</h4>
                            <p>استمر يا بطل 🔥</p>
                        </div>
                    </div>
                `;
                document.getElementById('commentCountDisplay').innerText = videos[index].comments;
            }
        }

        function addComment() {
            const input = document.getElementById('commentInput');
            const text = input.value;
            
            if (text) {
                const list = document.getElementById('commentsList');
                const newComment = document.createElement('div');
                newComment.className = 'comment-item';
                newComment.innerHTML = `
                    <div class="avatar" style="background: green;"></div>
                    <div class="comment-content">
                        <h4>أنت</h4>
                        <p>${text}</p>
                    </div>
                `;
                list.appendChild(newComment);
                input.value = '';
                
                // تحديث العداد (وهمي)
                let countSpan = document.getElementById('commentCountDisplay');
                countSpan.innerText = parseInt(countSpan.innerText) + 1;
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>اللعبة الدينية للأطفال</title>

<style>
body{
font-family:Arial;
background:linear-gradient(#89f7fe,#ffffff);
text-align:center;
padding:15px;
}

.card{
background:white;
max-width:520px;
margin:auto;
padding:20px;
border-radius:20px;
box-shadow:0 0 15px rgba(0,0,0,0.2);
}

button{
width:100%;
padding:14px;
margin:8px 0;
font-size:16px;
border:none;
border-radius:12px;
cursor:pointer;
background:#4CAF50;
color:white;
}

#timer{font-size:22px;color:red}
#score{font-size:18px}

.avatar{
font-size:60px;
margin:10px;
}

.hidden{display:none}
</style>
</head>

<body>

<div class="card">

<h2>🎮 لعبة المراحل الدينية</h2>

<div class="avatar" id="avatar">🙂</div>

<h3 id="stageTitle"></h3>

<h3 id="question"></h3>

<div id="timer"></div>
<div id="score"></div>

<div id="answers"></div>

<div id="result"></div>

<button onclick="nextQuestion()">التالي ▶</button>

</div>

<script>
const sounds={
correct:new Audio("https://actions.google.com/sounds/v1/cartoon/clang.ogg"),
wrong:new Audio("https://actions.google.com/sounds/v1/cartoon/boing.ogg"),
stage:new Audio("https://actions.google.com/sounds/v1/cartoon/concussive_hit_guitar_boing.ogg")
};

const avatars=["🙂","😎","🤓","🧒","👧"];

const stages=[
[
{q:"كم عدد الأئمة؟",a:["10","12","14"],c:1},
{q:"أين كربلاء؟",a:["العراق","مصر","لبنان"],c:0}
],
[
{q:"أول إمام؟",a:["علي","الحسن","الحسين"],c:0},
{q:"أم الحسن والحسين؟",a:["فاطمة","زينب","خديجة"],c:0}
],
[
{q:"لقب الإمام الحسين؟",a:["سيد الشهداء","الصادق","المرتضى"],c:0},
{q:"مدينة النجف فيها قبر؟",a:["علي","الحسين","العباس"],c:0}
]
];

let stageIndex=0;
let questions=[];
let current;
let score=0;
let timer,time;

function startStage(){
sounds.stage.play();
questions=[...stages[stageIndex]];
document.getElementById("stageTitle").textContent=
"⭐ المرحلة "+(stageIndex+1);

changeAvatar();
loadQuestion();
}

function changeAvatar(){
document.getElementById("avatar").textContent=
avatars[Math.floor(Math.random()*avatars.length)];
}

function startTimer(){
time=30;
updateTimer();

timer=setInterval(()=>{
time--;
updateTimer();

if(time<=0){
clearInterval(timer);
showResult("⏰ انتهى الوقت!");
disableButtons();
}
},1000);
}

function updateTimer(){
document.getElementById("timer").textContent="⏱ "+time;
}

function loadQuestion(){
clearInterval(timer);
document.getElementById("result").textContent="";

if(questions.length===0){
stageIndex++;

if(stageIndex>=stages.length){
alert("🎉 فزت باللعبة! نقاطك: "+score);
location.reload();
return;
}

alert("🚀 الانتقال للمرحلة التالية!");
startStage();
return;
}

current=questions.splice(Math.random()*questions.length|0,1)[0];

document.getElementById("question").textContent=current.q;

const answers=document.getElementById("answers");
answers.innerHTML="";

current.a.forEach((ans,i)=>{
let btn=document.createElement("button");
btn.textContent=ans;
btn.onclick=()=>checkAnswer(i);
answers.appendChild(btn);
});

startTimer();
}

function checkAnswer(i){
clearInterval(timer);

if(i===current.c){
score++;
sounds.correct.play();
showResult("✅ صحيح!");
}else{
sounds.wrong.play();
showResult("❌ خطأ!");
}

updateScore();
disableButtons();
}

function showResult(msg){
document.getElementById("result").textContent=msg;
}

function disableButtons(){
document.querySelectorAll("#answers button")
.forEach(b=>b.disabled=true);
}

function updateScore(){
document.getElementById("score").textContent="⭐ النقاط: "+score;
}

function nextQuestion(){
changeAvatar();
loadQuestion();
}

startStage();
</script>

</body>
</html>

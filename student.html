<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>صفحة الطالب</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:tahoma; background:#f9f9f9; padding:15px;}
.card{
    background:#fff; padding:15px; margin-bottom:10px;
    border-radius:10px; box-shadow:0 0 5px #ccc;
}
</style>
</head>
<body>

<h2>📚 دروسك</h2>
<div id="lessons"></div>

<script>
function loadLessons(){
    let data = JSON.parse(localStorage.getItem("lessons") || "[]");
    let div = document.getElementById("lessons");
    div.innerHTML = "";

    data.forEach((l)=>{
        div.innerHTML += `
            <div class="card">
                <b>${l.title}</b>
                <p>${l.content}</p>
            </div>
        `;
    });
}

loadLessons();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السائق - تكسي العراق الشامل</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<style>
body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Tahoma;
    overflow: hidden; /* ⭐⭐ إزالة شريط التمرير ⭐⭐ */
    display: flex;
    flex-direction: column;
}

#panel {
    background: #fff;
    padding: 10px;
    text-align: center;
    box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.2);
    /* ⭐⭐ ضمان بقاء اللوحة في الأسفل ⭐⭐ */
    flex-shrink: 0; 
}

/* ⭐⭐ تعديل ارتفاع الخريطة ليكون ديناميكياً ⭐⭐ */
#map {
    height: calc(100vh - 120px); /* قيمة افتراضية سيتم تعديلها بواسطة JS */
    transition: height 0.3s ease-in-out;
    flex-grow: 1; /* لتأخذ المساحة المتبقية */
}

button {
    background: #ffb300;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    margin: 5px;
    font-weight: bold;
    cursor: pointer;
}
#logoutBtn {
    background: #455a64;
    color: white;
    margin-top: 10px;
    width: 95%;
}

/* تنسيقات الأزرار العائمة الجديدة */
#floatingControls {
    position: absolute;
    bottom: 10px;
    left: 10px;
    z-index: 1000;
    direction: ltr;
    display: flex; /* تفعيل Flexbox */
    flex-direction: column-reverse; /* لعرض الأزرار من الأسفل للأعلى (الإنهاء في الأسفل) */
    align-items: flex-start; /* محاذاة العناصر إلى اليسار */
    gap: 10px; /* مسافة بين العناصر */
}
#floatingControls button,
#floatingControls .ride-action-info {
    display: block;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    border-radius: 8px;
    width: 150px;
    font-size: 14px;
    padding: 10px;
    margin: 0; /* إزالة الهامش الافتراضي لتجنب الاختلاط */
}
.ride-action-info {
    background: #fff;
    padding: 5px;
    color: #333;
    font-size: 0.9em;
    direction: rtl;
    text-align: center;
}
.phone-link {
    color: #007bff;
    text-decoration: none;
    font-weight: bold;
    display: block;
    margin: 0;
    font-size: 1em;
}
.phone-link:hover {
    text-decoration: underline;
}
#startRideBtn {
    background: #ff9800;
    color: white;
}
#finishBtn {
    background: #1e88e5;
    color: white;
}
#wazeBtn {
    background: #1E90FF;
    color: white;
}
</style>
</head>
<body>

<div id="map"></div>

<div id="floatingControls" style="display:none;">
    <button id="startRideBtn" style="display:none;">بدء الرحلة 🚦</button> 
    <button id="finishBtn" style="display:none;">إنهاء الرحلة</button>
    
    <button id="wazeBtn" onclick="openWaze()"></button>
    
    <div id="riderContactInfo" class="ride-action-info" style="display:none;"></div>
</div>


<div id="panel">
    <h3>🚖 وضع السائق</h3>
    <p id="status">في انتظار الطلبات...</p>
    
    <button id="acceptBtn" style="display:none;background:#4caf50;color:white;">قبول الرحلة</button>
    <button id="rejectBtn" style="display:none;background:#e53935;color:white;">رفض الرحلة</button>
    
    <button id="logoutBtn" onclick="logout()">تسجيل الخروج</button>
</div>

<script>
// منع الدخول بدون حساب
window.onload=function(){
    let phone=localStorage.getItem("phone");
    let type=localStorage.getItem("userType");
    if(!phone||type!=="driver"){
        window.location.href="index.html";
    }
    // ⭐⭐ حساب ارتفاع الخريطة عند التحميل ⭐⭐
    updateMapHeight();
    window.addEventListener('resize', updateMapHeight);
};

function logout(){
    localStorage.clear();
    window.location.href="index.html";
}

// Firebase
const app=firebase.initializeApp({
  apiKey:"AIzaSyBZy7GTKn62CqeXAgm2fLrXI67P4Lc4Q3M",
  authDomain:"taxi-15314.firebaseapp.com",
  databaseURL:"https://taxi-15314-default-rtdb.firebaseio.com/",
  projectId:"taxi-15314"
});
const db=firebase.database();

// إنشاء الخريطة
let map=L.map('map').setView([33.3152,44.3661],13);

// ⭐⭐ خريطة Google Maps ⭐⭐
L.tileLayer(
 "https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&key=AIzaSyD7TtwniAdUtB8-pnTny4ZwE6gqX36SGUk",
 {maxZoom:20}
).addTo(map);

map.whenReady(()=>map.invalidateSize());

// موقع السائق
let driverMarker=null;
let driverPhone=localStorage.getItem("phone");

// ===== المتغيرات الجديدة للرحلة والمسارات =====
let currentRideId=null;
let passengerMarker=null;
let pickupRoute=null; // مسار نقطة البداية (من السائق للراكب)
let destinationRoute=null; // مسار نقطة النهاية (من الراكب لنقطة النهاية)
let currentRideData=null;
// ===========================================

// ⭐⭐ دالة لحساب ارتفاع لوحة التحكم وتعيين ارتفاع الخريطة ⭐⭐
function updateMapHeight() {
    const panelHeight = panelElement.offsetHeight;
    if (panelElement.style.display !== "none") {
        // إذا كانت اللوحة مرئية، اجعل ارتفاع الخريطة يساوي ارتفاع الشاشة الكلي ناقص ارتفاع اللوحة
        mapElement.style.height = `calc(100vh - ${panelHeight}px)`;
    } else {
        // إذا كانت اللوحة مخفية، اجعل الخريطة بكامل ارتفاع الشاشة
        mapElement.style.height = '100vh';
    }
    map.invalidateSize();
}
// ⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐

// تحديث موقع السائق كل 5 ثوانٍ
setInterval(()=>{
    navigator.geolocation.getCurrentPosition(pos=>{
        let lat=pos.coords.latitude;
        let lng=pos.coords.longitude;

        if(driverMarker) map.removeLayer(driverMarker);
        driverMarker=L.marker([lat,lng]).addTo(map).bindPopup("📍 موقعك");

        db.ref("drivers/"+driverPhone).set({
            lat:lat,lng:lng,status:"متصل"
        });
        
        // التركيز على السائق عند عدم وجود رحلة نشطة
        if (!currentRideId) {
            map.setView([lat, lng], map.getZoom() > 13 ? map.getZoom() : 13);
        }

    },err=>{},{
        enableHighAccuracy:true,timeout:5000
    });
},5000);

// الدوال المساعدة للمسارات والمؤشرات
function removeAllRideMarkers(){
    if(passengerMarker) map.removeLayer(passengerMarker);
    if(pickupRoute) map.removeLayer(pickupRoute);
    if(destinationRoute) map.removeLayer(destinationRoute);
    passengerMarker=null;
    pickupRoute=null;
    destinationRoute=null;
    
    // إزالة مؤشرات نقطة البداية والنهاية الأخرى
    map.eachLayer(layer => {
        if (layer instanceof L.Marker && layer !== driverMarker) {
            const popupContent = layer.getPopup().getContent();
            if (popupContent && (popupContent.includes("نقطة النهاية") || popupContent.includes("نقطة البداية"))) {
                map.removeLayer(layer);
            }
        }
    });
}

// الدالة: جلب ورسم مسار حقيقي على الشوارع باستخدام OSRM
async function drawStreetRoute(lat1, lng1, lat2, lng2, color, dashArray = '') {
    // خدمة OSRM تتطلب الإحداثيات بصيغة: lng,lat
    const OSRM_URL = `https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?geometries=geojson&overview=full`;
    
    try {
        const response = await fetch(OSRM_URL);
        const data = await response.json();

        if (data.code !== 'Ok' || !data.routes || data.routes.length === 0) {
            console.error('OSRM route calculation failed or no route found. Falling back to straight line.');
            // العودة إلى الرسم البسيط في حال الفشل
            return L.polyline([[lat1, lng1], [lat2, lng2]], { color: color, dashArray: dashArray, weight: 5 }).addTo(map);
        }

        // استخراج إحداثيات المسار من الاستجابة (بصيغة GeoJSON: [lng, lat])
        const geojsonCoords = data.routes[0].geometry.coordinates;

        // تحويل الإحداثيات إلى صيغة Leaflet ([lat, lng])
        const leafletCoords = geojsonCoords.map(coord => [coord[1], coord[0]]);

        let route = L.polyline(leafletCoords, { color: color, dashArray: dashArray, weight: 5 }).addTo(map);
        return route;

    } catch (error) {
        console.error('Error fetching route from OSRM. Falling back to straight line.', error);
        // العودة إلى الرسم البسيط في حال الفشل
        return L.polyline([[lat1, lng1], [lat2, lng2]], { color: color, dashArray: dashArray, weight: 5 }).addTo(map);
    }
}


// دالة Waze الموحدة التي تحدد الوجهة بناءً على حالة الرحلة
function openWaze(){
    if(!currentRideData) return;

    let lat, lng;
    let status = currentRideData.status;
    
    // إذا كانت مقبولة (ذاهب للراكب)، اذهب إلى موقع الراكب (نقطة البداية)
    if (status === "مقبولة" && currentRideData.startLat && currentRideData.startLng) {
        lat = currentRideData.startLat;
        lng = currentRideData.startLng;
    } 
    // إذا كانت بدأت (ذاهب للوجهة)، اذهب إلى نقطة النهاية
    else if (status === "بدأت" && currentRideData.endLat && currentRideData.endLng) {
        lat = currentRideData.endLat;
        lng = currentRideData.endLng;
    } else {
        return; // لا يوجد إحداثيات أو حالة غير مناسبة
    }

    if(lat && lng){
        window.open(`https://www.waze.com/ul?ll=${lat},${lng}&navigate=yes`, '_blank');
    }
}


// استقبال الطلبات
const statusText=document.getElementById("status");
const acceptBtn=document.getElementById("acceptBtn");
const rejectBtn=document.getElementById("rejectBtn");
const startRideBtn=document.getElementById("startRideBtn");
const finishBtn=document.getElementById("finishBtn");
const wazeBtn=document.getElementById("wazeBtn");
const logoutBtn=document.getElementById("logoutBtn"); 
const floatingControls=document.getElementById("floatingControls"); // عنصر التحكم العائم
const riderContactInfo=document.getElementById("riderContactInfo"); // معلومات الاتصال

const mapElement = document.getElementById("map"); 
const panelElement = document.getElementById("panel");

db.ref("rides").on("value",snap=>{
    let data=snap.val();
    if(!data) return;

    let rideFound=false;

    Object.keys(data).forEach(id=>{
        let r=data[id];
        // معالجة الطلبات الجديدة
        if(r.status==="جديدة" && !rideFound){
            rideFound=true;
            showRideRequest(id,r);
        }
        // معالجة الرحلات المقبولة حالياً
        else if(r.status==="مقبولة" && r.driverPhone===driverPhone){
             rideFound=true;
             handleAcceptedRide(id,r);
        }
        // معالجة الرحلات التي بدأت حالياً (تمت الإضافة)
        else if(r.status==="بدأت" && r.driverPhone===driverPhone){
             rideFound=true;
             handleStartedRide(id,r);
        }
    });

    if(!rideFound){
        removeAllRideMarkers();
        currentRideId=null;
        currentRideData=null;
        acceptBtn.style.display="none";
        rejectBtn.style.display="none";
        // إخفاء الأزرار العائمة ومحتوياتها
        startRideBtn.style.display="none";
        finishBtn.style.display="none";
        wazeBtn.style.display="none";
        riderContactInfo.style.display="none";
        floatingControls.style.display="none";
        
        logoutBtn.style.display="inline-block"; // إظهار زر تسجيل الخروج
        statusText.innerText="في انتظار الطلبات...";
        
        // إظهار لوحة التحكم وإعادة حساب حجم الخريطة 
        panelElement.style.display="block"; 
        updateMapHeight();
    }
});

function showRideRequest(id,r){
    currentRideId=id;
    currentRideData=r;
    
    // إخفاء الأزرار المتبقية والعائمة
    startRideBtn.style.display="none";
    finishBtn.style.display="none";
    wazeBtn.style.display="none";
    riderContactInfo.style.display="none";
    floatingControls.style.display="none";
    logoutBtn.style.display="inline-block"; // إظهار تسجيل الخروج
    removeAllRideMarkers();

    // التأكد من وضع الخريطة ولوحة التحكم في وضع الطلب الجديد
    panelElement.style.display="block"; 
    updateMapHeight();

    // حساب وعرض الأجرة
    const distance = parseFloat(r.distance) || 0;
    const fare = r.fare || Math.round(distance * 1000); // 1000 دينار لكل كم
    const formattedFare = fare.toLocaleString('ar-IQ') || '...';


    statusText.innerHTML=
      `🚖 طلب جديد<br>
       من: **${r.startArea}** إلى: **${r.endArea}**<br>
       **مسافة الرحلة:** ${r.distance} كم<br>
       **الأجرة المتوقعة:** ${formattedFare} د.ع`;

    acceptBtn.style.display="inline-block";
    rejectBtn.style.display="inline-block";

    // عند قبول الرحلة
    acceptBtn.onclick=function(){
        db.ref("rides/"+id).update({status:"مقبولة",driverPhone:driverPhone});
    };

    // عند رفض الرحلة
    rejectBtn.onclick=function(){
        db.ref("rides/"+id).update({status:"مرفوضة"});
        statusText.innerText="تم رفض الرحلة.";
        acceptBtn.style.display="none";
        rejectBtn.style.display="none";
    };
}

// جعل الدالة غير متزامنة (async) لاستخدام fetch
async function handleAcceptedRide(id,r){
    currentRideId=id;
    currentRideData=r;
    
    // إخفاء أزرار لوحة التحكم الأساسية
    acceptBtn.style.display="none";
    rejectBtn.style.display="none";
    logoutBtn.style.display="none"; 
    
    // إخفاء لوحة التحكم وتكبير الخريطة 
    panelElement.style.display="none"; 
    updateMapHeight(); // ⭐⭐ تحديث الارتفاع إلى 100vh ⭐⭐
    
    // إظهار الأزرار العائمة
    floatingControls.style.display="flex";
    riderContactInfo.style.display = "block";
    startRideBtn.style.display="inline-block"; // إظهار زر البدء
    finishBtn.style.display="none"; // إخفاء زر الإنهاء
    wazeBtn.style.display="inline-block"; // إظهار زر ويز
    wazeBtn.innerText = "ويز: اذهب للراكب 🚗"; // تحديث نص زر ويز

    // عرض معلومات الاتصال بالراكب
    riderContactInfo.innerHTML = `
        <a href="tel:${r.riderPhone}" class="phone-link">
            📞 اتصل بالراكب: ${r.riderPhone}
        </a>
    `;

    removeAllRideMarkers();
    
    // إضافة مسار الراكب
    if(r.startLat && r.startLng && driverMarker){
        let driverLat=driverMarker.getLatLng().lat;
        let driverLng=driverMarker.getLatLng().lng;

        // استخدام الدالة الجديدة لرسم مسار الشوارع
        pickupRoute = await drawStreetRoute(driverLat, driverLng, r.startLat, r.startLng, '#4caf50', '10, 10'); 

        // وضع مؤشر الراكب
        passengerMarker=L.marker([r.startLat, r.startLng]).addTo(map).bindPopup("👤 موقع الراكب");
        map.setView([r.startLat, r.startLng], 14); // التركيز على الراكب
    }

    statusText.innerHTML=`تم قبول الرحلة. في طريقك للراكب **(${r.startArea})**...`;


    // زر بدء الرحلة يقوم فقط بتحديث الحالة
    startRideBtn.onclick=function(){
        db.ref("rides/"+id).update({status:"بدأت"});
    };
    
    // عند الضغط على إنهاء الرحلة (لمنع الإنهاء العرضي)
    finishBtn.onclick=function(){
        db.ref("rides/"+id).update({status:"منتهية"});
    };
}

// جعل الدالة غير متزامنة (async) لاستخدام fetch
async function handleStartedRide(id,r){
    currentRideId=id;
    currentRideData=r;
    
    // إخفاء أزرار لوحة التحكم الأساسية
    acceptBtn.style.display="none";
    rejectBtn.style.display="none";
    logoutBtn.style.display="none";
    
    // إخفاء لوحة التحكم وتكبير الخريطة 
    panelElement.style.display="none"; 
    updateMapHeight(); // ⭐⭐ تحديث الارتفاع إلى 100vh ⭐⭐
    
    // إظهار الأزرار العائمة
    floatingControls.style.display="flex";
    riderContactInfo.style.display = "block";
    startRideBtn.style.display="none";
    finishBtn.style.display="inline-block"; // إظهار زر الإنهاء
    wazeBtn.style.display="inline-block"; // إظهار زر ويز
    wazeBtn.innerText = "ويز: اذهب للوصول 🏁"; // تحديث نص زر ويز

    removeAllRideMarkers(); // مسح أي مسارات سابقة (مثل مسار القبول)

    // عرض معلومات الاتصال بالراكب
    riderContactInfo.innerHTML = `
        <a href="tel:${r.riderPhone}" class="phone-link">
            📞 اتصل بالراكب: ${r.riderPhone}
        </a>
    `;
    
    // تحديث رسالة الحالة
    statusText.innerHTML=`الرحلة بدأت! الوجهة: **${r.endArea}**`;
    
    // مسار نقطة النهاية (من نقطة البداية إلى نقطة الوصول)
    if(r.startLat && r.startLng && r.endLat && r.endLng){
        let startLat=r.startLat;
        let startLng=r.startLng;
        let endLat=r.endLat;
        let endLng=r.endLng;
        
        // استخدام الدالة الجديدة لرسم مسار الشوارع
        destinationRoute = await drawStreetRoute(startLat, startLng, endLat, endLng, '#1e88e5');

        // تحديث مؤشر الراكب ليكون في نقطة البداية
        passengerMarker=L.marker([startLat, startLng]).addTo(map).bindPopup("🟢 نقطة البداية").openPopup();
        
        // إضافة مؤشر لنقطة النهاية
        L.marker([endLat, endLng]).addTo(map).bindPopup("🏁 نقطة النهاية");
        map.fitBounds([[startLat, startLng], [endLat, endLng]]); // التركيز على المسار الجديد
    }

    // عند الضغط على إنهاء الرحلة
    finishBtn.onclick=function(){
        db.ref("rides/"+id).update({status:"منتهية"});
        // التنظيف يتم في الحلقة الرئيسية
    };
}
// ===============================================
</script>

</body>
</html>

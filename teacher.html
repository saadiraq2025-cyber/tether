<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة المدرّس</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:tahoma; background:#eef2ff; padding:15px;}
.box{
    background:#fff;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 0 5px #aaa;
}
input, textarea{
    width:100%; padding:10px; margin:5px 0; border:1px solid #aaa;
    border-radius:6px;
}
button{
    width:100%; padding:10px; background:#2b7cff; color:#fff;
    border:none; border-radius:6px; font-size:16px; margin-top:10px;
}
</style>
</head>
<body>

<h2>مرحباً أيها المدرّس</h2>

<div class="box">
<h3>➕ إضافة درس جديد</h3>
<input id="title" placeholder="عنوان الدرس">
<textarea id="content" rows="4" placeholder="محتوى الدرس أو رابط فيديو"></textarea>
<button onclick="addLesson()">إضافة</button>
</div>

<div class="box">
<h3>📘 جميع الدروس</h3>
<div id="lessons"></div>
</div>

<script>
function loadLessons(){
    let data = JSON.parse(localStorage.getItem("lessons") || "[]");
    let div = document.getElementById("lessons");
    div.innerHTML = "";

    data.forEach((l,i)=>{
        div.innerHTML += `
            <div style='padding:10px; border-bottom:1px solid #ddd'>
            <b>${l.title}</b><br>
            <p>${l.content}</p>
            </div>
        `;
    });
}

function addLesson(){
    let title = document.getElementById("title").value;
    let content = document.getElementById("content").value;

    if(title==="" || content===""){
        alert("املأ جميع الحقول");
        return;
    }

    let data = JSON.parse(localStorage.getItem("lessons") || "[]");
    data.push({title, content});
    localStorage.setItem("lessons", JSON.stringify(data));
    loadLessons();
    alert("تمت إضافة الدرس");
}

loadLessons();
</script>
</body>
</html>
